<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>橫向戰鬥試玩</title>
<link rel="stylesheet" href="style.css?v=20261023f">
<style>
  .stage { width: 100%; height: auto; border: 2px solid var(--line); background: #0b0a12; touch-action: manipulation; }
  .bar { display: flex; justify-content: space-between; margin: 6px 0; font-size: 14px; }
  .acts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
  .acts .btn { padding: 10px 4px; font-size: 15px; }
  .acts .btn.active { border-color: var(--gold); background: #3a3420; }
  .acts .btn.glow { border-color: var(--gold); animation: glow 0.8s infinite alternate; }
  .desc { min-height: 44px; font-size: 13px; line-height: 1.5; margin-top: 8px; color: var(--muted); }
  .pick { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
  .pick .btn { flex: 1 0 30%; padding: 8px 4px; font-size: 14px; }
  .pick .btn.active { border-color: var(--gold); background: #3a3420; }
  .intro { font-size: 13px; line-height: 1.5; margin-bottom: 6px; }
  .log { font-size: 13px; color: var(--muted); margin-top: 6px; min-height: 40px; }
</style>
</head>
<body>
<div id="app">
  <h2>橫向戰鬥・試玩</h2>
  <p class="muted" style="font-size:13px">試試看「左右對站」的打法。先選主角，打完可以換下一批敵人，最後一批是首領。</p>
  <div class="pick"></div>
  <div class="intro"></div>
  <canvas class="stage" width="384" height="216"></canvas>
  <div class="bar"><span class="hp"></span><span class="who"></span></div>
  <div class="acts"></div>
  <div class="desc"></div>
  <div class="log"></div>
  <a class="btn wide" href="./" style="display:block;text-align:center;text-decoration:none;margin-top:10px">回遊戲</a>
</div>
<script src="js/data.js?v=20261023f"></script>
<script src="js/jobs.js?v=20261023f"></script>
<script src="js/sprites.js?v=20261023f"></script>
<script>
'use strict';
// 橫向回合制原型：我方站左邊、敵人站右邊，各自有前後排。點技能，再點目標。
const W = 384, H = 216, GROUND = 196;
const cv = document.querySelector('.stage'), g = cv.getContext('2d');
g.imageSmoothingEnabled = false;
const $ = (s) => document.querySelector(s);
// 換主角或重開時 gen 會加一：舊的動作卡在下一個等待點，不會跑到新的一局
let gen = 0;
const sleep = (ms) => { const my = gen; return new Promise((r) => setTimeout(() => { if (my === gen) r(); }, ms)); };
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const tween = (ms, fn) => { const my = gen; return new Promise((res) => { const t0 = performance.now(); const f = (n) => { if (my !== gen) return; const t = Math.min(1, (n - t0) / ms); fn(t); t < 1 ? requestAnimationFrame(f) : res(); }; requestAnimationFrame(f); }); };

// 可以選的主角：每個人的招式動作都配合自己的圖
const HEROES = {
  yuelao: {
    name: '月老', gauge: '神力', stats: { hp: 30, atk: 5, def: 2, spd: 5 },
    actions: {
      attack: { name: '攻擊', desc: '衝上去揍前兩排的一個敵人。', target: 'enemyFront' },
      pull:   { name: '情感牽線', desc: '甩紅線綁住任一個敵人：詛咒 2 回合（受到的傷害加五成），把它拉到最前排。冷卻 3', target: 'enemy', cd: 3 },
      heal:   { name: '社群經營', desc: '自己或引魂犬回復 9 點生命，護盾 1 回合（受到的傷害減半）。冷卻 2', target: 'ally', cd: 2 },
      ult:    { name: '人口普查', desc: '神力滿 100% 才能用。全場敵人受到 3 點傷害（無視防禦），定身 1 回合。', target: 'none' },
    },
  },
  horusshadow: {
    name: '荷魯斯之影', gauge: '魔力', stats: { hp: 26, atk: 6, def: 1, spd: 7, dodge: 0.15 },
    passive: '暗影滲透：15% 機率閃避攻擊；打倒敵人時魔力 +20%。',
    actions: {
      attack: { name: '權杖金光', desc: '鷹頭權杖射出金光，打前兩排的一個敵人（不用衝上前）。', target: 'enemyFront' },
      spy:    { name: '暗影諜報', desc: '荷魯斯之眼放出暗影，打任一個敵人 2 點（無視防禦），讓它失明 2 回合（攻擊一半機率落空）。冷卻 2', target: 'enemy', cd: 2 },
      steal:  { name: '數據竊取', desc: '金光貫穿前兩排的一個敵人，造成 1.2 倍傷害，並吸取其中三成回復自己。冷卻 2', target: 'enemyFront', cd: 2 },
      ult:    { name: '競品打擊', desc: '魔力滿 100% 才能用。召喚 2 個暗影分身，輪流突襲全場敵人（每次 3 點，無視防禦）。', target: 'none' },
    },
  },
  redgirl: {
    name: '紅衣小女孩', gauge: '魔力', stats: { hp: 24, atk: 5, def: 1, spd: 8, dodge: 0.1 },
    passive: '紅衣誘引：10% 機率閃避；打中敵人時 25% 機率讓它詛咒 2 回合。',
    actions: {
      attack: { name: '撲抓', desc: '蹲低再撲上去，抓前兩排的一個敵人。', target: 'enemyFront' },
      mist:   { name: '山徑迷霧', desc: '揮手召出紅色山霧，罩住前兩排敵人：失明 1 回合，而且混亂 1 回合（會攻擊自己人）。冷卻 3', target: 'none', cd: 3 },
      smile:  { name: '詭異微笑', desc: '一眨眼就出現在任一個敵人面前，對它微笑再抓一下（1 倍傷害），然後消失回原位。冷卻 3', target: 'enemy', cd: 3 },
      ult:    { name: '跟著我走', desc: '魔力滿 100% 才能用。紅霧吞沒全場：所有敵人混亂 1 回合、詛咒 2 回合（受到的傷害加五成）。', target: 'none' },
    },
  },
};
// 新一批職業（JOB_ART 有圖的）：招式直接用職業資料產生，每招播自己的專屬動作
const SIDE_RANK = { r1: 0, r2: 1, r3: 2 };
function sideTarget(sk) {
  if (sk.t === 'ally') return 'ally';
  if (sk.t === 'enemy') return sk.r[1] <= 1 && !sk.fx.blink ? 'enemyFront' : 'enemy';
  if (sk.t === 'tile') return sk.fx.teleport ? 'none' : 'enemy';
  return 'none';
}
function sideArea(sk, target) {
  const a = sk.a || 'single', who = sk.who || (sk.t === 'ally' ? 'ally' : 'enemy');
  if (sk.t === 'self') {
    if (a === 'single') return [units[0]];
    return a === 'all' || who === 'ally' ? alive(who) : alive(who).filter((u) => u.rank <= SIDE_RANK[a]);
  }
  if (sk.t === 'tile' && sk.fx.teleport) return [units[0]];
  if (sk.t === 'tile' && a !== 'single') return alive('enemy').filter((u) => Math.abs(u.rank - target.rank) <= 1);
  return [target];
}
function describeSide(sk, g) {
  const fx = sk.fx, a = sk.a || 'single', who = sk.who || (sk.t === 'ally' ? 'ally' : 'enemy');
  let area;
  if (sk.t === 'self') area = a === 'single' ? '自己' : who === 'ally' ? '我方全體' : a === 'all' ? '全場敵人' : SIDE_RANK[a] ? `前 ${SIDE_RANK[a] + 1} 排的敵人` : '最前排的敵人';
  else if (sk.t === 'ally') area = '自己或引魂犬';
  else if (sk.t === 'tile') area = fx.teleport ? '自己' : a === 'single' ? '任一個敵人' : '任一個敵人和它前後的敵人';
  else area = sideTarget(sk) === 'enemyFront' ? '前兩排的一個敵人' : '任一個敵人';
  const out = [];
  if (fx.teleport) out.push('閃身躲開，下一次被攻擊必定閃避');
  if (fx.blink) out.push('一眨眼衝到目標面前');
  if (fx.dmg) out.push(fx.hits ? `連打 ${fx.hits} 次，每次 ${fx.dmg} 倍攻擊` : `造成 ${fx.dmg} 倍攻擊的傷害`);
  if (fx.fixed) out.push(`造成 ${fx.fixed} 點傷害（無視防禦）`);
  if (fx.lowHpBonus) out.push('目標生命低於一半時傷害加五成');
  if (fx.execute) out.push(`生命低於 ${Math.round(fx.execute * 100)}% 的非首領敵人直接倒下`);
  if (fx.heal) out.push(`回復 ${fx.heal} 點生命`);
  if (fx.shield) out.push(`護盾 ${fx.shield} 回合（受到的傷害減半）`);
  if (fx.buffAtk) out.push(`攻擊 +${fx.buffAtk}（這場戰鬥）`);
  if (fx.cleanse) out.push('解除負面狀態');
  if (fx.stun) out.push(`定身 ${fx.stun} 回合`);
  if (fx.blind) out.push(`失明 ${fx.blind} 回合（攻擊一半落空）`);
  if (fx.confuse) out.push(`混亂 ${fx.confuse} 回合（會攻擊自己人）`);
  if (fx.curse) out.push(`詛咒 ${fx.curse} 回合（受到的傷害加五成）`);
  if (fx.push) out.push('擊退到最後一排');
  if (fx.pull) out.push('拉到最前排');
  if (fx.drain) out.push(`吸取 ${Math.round(fx.drain * 10)} 成傷害`);
  if (fx.charge) out.push(`${g} +${fx.charge}%`);
  if (fx.summon) out.push(`召喚 ${fx.summon.n} 個分身突襲全場敵人`);
  if (fx.extraTurn) out.push('立刻再行動一次');
  if (fx.selfHurt) out.push(`自己失去 ${fx.selfHurt} 點生命`);
  return `${area}：${out.join('，')}` + (sk.cd ? `。冷卻 ${sk.cd}` : '');
}
for (const id of Object.keys(JOB_ART)) {
  const J = JOBS[id], p = J.passive.p, g = J.side === '神' ? '神力' : '魔力', art = ART[id];
  const act = (sk, k) => ({ name: sk.n, desc: describeSide(sk, g), target: k === 'ult' ? (sideTarget(sk) === 'none' ? 'none' : sideTarget(sk)) : sideTarget(sk), cd: sk.cd, sk });
  HEROES[id] = {
    name: J.name, gauge: g, job: true,
    stats: { hp: 26 + (p.hp || 0), atk: 5 + (p.atk || 0), def: 1 + (p.def || 0), spd: 5 + (p.spd || 0), dodge: p.dodge || 0, regen: p.regen || 0 },
    passive: `${J.passive.n}：${describePassive(p, g)}。`,
    actions: {
      attack: { name: '攻擊', desc: art.melee ? '衝上去打前兩排的一個敵人。' : '遠遠攻擊前兩排的一個敵人。', target: 'enemyFront' },
      s0: act(J.skills[0], 's0'), s1: act(J.skills[1], 's1'),
      ult: { ...act(J.ult, 'ult'), desc: `${g}滿 100% 才能用。` + describeSide(J.ult, g) },
    },
  };
}

let heroId = 'yuelao';
let ACTIONS = HEROES[heroId].actions;

let units, turnQueue, current, picking, busy, charge, cds, effects, shake, over;

// 每一批敵人；最後一批是首領
const FOES = {
  shade:   { name: '影子怪',     hp: 12, atk: 5, def: 1, spd: 4 },
  husk:    { name: '空殼職員',   hp: 18, atk: 6, def: 2, spd: 3 },
  wisp:    { name: '鬼火',       hp: 8,  atk: 4, def: 0, spd: 6, ranged: true },
  mirror:  { name: '鏡中人',     hp: 16, atk: 5, def: 0, spd: 5 },
  hunter:  { name: '追殺者',     hp: 20, atk: 7, def: 2, spd: 6 },
  boss:    { name: '無臉典獄長', hp: 50, atk: 8, def: 3, spd: 4, boss: true },
  zombie:  { name: '加班殭屍',   hp: 22, atk: 6, def: 2, spd: 2 },
  printer: { name: '卡紙印表機', hp: 14, atk: 5, def: 3, spd: 4, ranged: true },
  judge:   { name: '考績審判官', hp: 60, atk: 9, def: 3, spd: 4, boss: true },
};
const WAVES = [['zombie', 'printer', 'wisp'], ['mirror', 'hunter', 'zombie'], ['shade', 'husk', 'printer'], ['boss'], ['judge']];
let wave = 0;

function reset(next) {
  gen++;
  if (next === true) wave = (wave + 1) % WAVES.length;
  const H0 = HEROES[heroId]; ACTIONS = H0.actions;
  units = [
    { id: 'hero', side: 'ally', name: H0.name, art: heroId, maxHp: H0.stats.hp, ...H0.stats, rank: 0 },
    { id: 'dog', side: 'ally', name: '引魂犬', sprite: 'dog', hp: 20, maxHp: 20, atk: 5, def: 1, spd: 7, rank: 1 },
    ...WAVES[wave].map((k, r) => ({ id: 'e' + r, side: 'enemy', sprite: k, rank: r, maxHp: FOES[k].hp, ...FOES[k] })),
  ];
  for (const u of units) Object.assign(u, { ox: 0, oy: 0, flash: 0, anim: null, curse: 0, stun: 0, shield: 0, blind: 0, confuse: 0, dead: false, atkUntil: 0, hurtUntil: 0 });
  charge = 0; cds = {}; effects = []; shake = 0; over = false; picking = null; busy = false;
  $('.log').textContent = '輪到誰行動，畫面下方會顯示。';
  nextRound();
}

// ───── 位置與畫 ─────
const home = (u) => u.side === 'ally' ? 150 - u.rank * 62 : (u.boss ? 290 : 236 + u.rank * 58);
const alive = (side) => units.filter((u) => u.side === side && !u.dead);

function drawBackground(now) {
  // 後牆：辦公大樓的走廊，門、公告欄、閃爍的燈
  g.fillStyle = '#211d2b'; g.fillRect(0, 0, W, 150);
  g.fillStyle = '#2a2536';
  for (let x = 0; x < W; x += 48) g.fillRect(x, 0, 2, 150);
  for (let i = 0; i < 4; i++) {
    const dx = 20 + i * 96;
    g.fillStyle = '#16131e'; g.fillRect(dx, 62, 40, 88);
    g.fillStyle = '#3a3448'; g.fillRect(dx - 3, 59, 46, 3); g.fillRect(dx - 3, 59, 3, 91); g.fillRect(dx + 40, 59, 3, 91);
    g.fillStyle = '#c8b860'; g.fillRect(dx + 32, 104, 4, 2);
    g.fillStyle = '#3c5a3a'; g.fillRect(dx + 8, 40, 24, 8); g.fillStyle = '#7ae07a'; g.fillRect(dx + 11, 43, 18, 2);
  }
  g.fillStyle = '#4a3a2a'; g.fillRect(126, 70, 36, 26); g.fillStyle = '#d8d0b0';
  for (let k = 0; k < 5; k++) g.fillRect(130 + (k % 3) * 10, 74 + Math.floor(k / 3) * 10, 7, 7);
  // 天花板燈
  for (let i = 0; i < 4; i++) {
    const on = !(i === 2 && Math.floor(now / 140) % 9 === 0);
    g.fillStyle = on ? '#e8f0d0' : '#4a4a40'; g.fillRect(36 + i * 96, 6, 32, 3);
    if (on) { const grd = g.createRadialGradient(52 + i * 96, 10, 2, 52 + i * 96, 60, 90); grd.addColorStop(0, 'rgba(230,240,200,0.10)'); grd.addColorStop(1, 'rgba(230,240,200,0)'); g.fillStyle = grd; g.fillRect(i * 96, 0, 104, 160); }
  }
  // 牆腳＋地板（往前透視的磁磚）
  g.fillStyle = '#3a3448'; g.fillRect(0, 146, W, 4);
  g.fillStyle = '#2a2632'; g.fillRect(0, 150, W, H - 150);
  g.fillStyle = '#221f2a';
  for (let y = 150, k = 0; y < H; y += 8 + k * 2, k++) g.fillRect(0, y, W, 1);
  for (let i = -8; i <= 8; i++) { g.strokeStyle = '#221f2a'; g.beginPath(); g.moveTo(W / 2 + i * 30, 150); g.lineTo(W / 2 + i * 60, H); g.stroke(); }
  // 地上的水漬反光
  g.fillStyle = 'rgba(120,160,220,0.08)'; g.fillRect(60, 200, 90, 4); g.fillRect(250, 206, 70, 3);
}

function drawUnit(u, now) {
  if (u.dead && u.art && !u.anim) return;
  const x = home(u) + u.ox, flip = u.side === 'enemy';
  const white = u.flash > now && Math.floor((u.flash - now) / 60) % 2 === 0;
  // 影子
  if (!u.dead) { g.fillStyle = 'rgba(0,0,0,0.4)'; g.beginPath(); g.ellipse(x, GROUND, u.boss ? 34 : u.art ? 22 : 20, 4, 0, 0, Math.PI * 2); g.fill(); }
  if (u.art) {
    let sheet = 'pose', i = 0;
    let A = { walk: ['walk', [100, 100, 100, 100], true], punch: ['punch', [70, 80, 260, 120]], cast: ['cast', [110, 110, 110, 380]], hurt: ['hurt', [150, 300]], down: ['hurt', [150, 200, 99999]] };
    // 新一批職業每張只有 3 格，動作表跟著圖走
    if (ART[u.art].anims) { A = { down: ['hurt', [150, 200, 99999]] }; for (const [k, v] of Object.entries(ART[u.art].anims)) A[k] = [v.sheet, v.ms, v.loop]; }
    if (u.anim && A[u.anim.name]) {
      const [s, ms, loop] = A[u.anim.name]; let t = now - u.anim.t0; const tot = ms.reduce((a, b) => a + b, 0);
      if (loop) t %= tot;
      if (t < tot) { sheet = s; while (t >= ms[i]) t -= ms[i++]; } else u.anim = null;
    } else if (!u.dead) i = 0;
    if (u.dead && !u.anim) return;
    if (u.ghost !== undefined) g.globalAlpha = Math.max(0, u.ghost);
    drawArt(g, u.art, sheet, i, x, GROUND + u.oy, 1, { white });
    g.globalAlpha = 1;
    // 飄職業記號（月老愛心、荷魯斯之眼）
    for (let k = 0; k < 2; k++) { const p = (now / 1800 + k / 2) % 1; drawMark(g, ART[u.art].mark, x + (k ? 18 : -28) + Math.sin(p * 6) * 3, GROUND - 50 - p * 40, 2, p < 0.2 ? p * 5 : 1 - (p - 0.2) / 0.8); }
  } else {
    // 新圖：0 待機、1 攻擊、2 被打；倒下就淡出
    const pose = now < u.hurtUntil || u.dead ? 2 : now < u.atkUntil ? 1 : 0;
    const bob = pose === 0 && Math.floor(now / 600 + u.rank) % 2 ? 1 : 0;
    if (u.dead) { const k = Math.max(0, Math.min(1, (now - u.deadAt) / 600)); if (k >= 1) return; g.globalAlpha = 1 - k; }
    drawArt(g, 'u:' + u.sprite, 'pose', pose, x, GROUND + u.oy + bob, 1, { flip, white });
    g.globalAlpha = 1;
    if (u.dead) return;
  }
  // 血條、狀態
  const top = GROUND - (u.art ? ART[u.art].sheets.pose[2] + 6 : UNIT_ART[u.sprite][1] + 8);
  g.fillStyle = '#000'; g.fillRect(x - 17, top - 1, 34, 5);
  g.fillStyle = u.side === 'ally' ? '#5fd35f' : '#e05050'; g.fillRect(x - 16, top, Math.max(0, 32 * u.hp / u.maxHp), 3);
  g.font = 'bold 10px sans-serif'; g.textAlign = 'center';
  const tags = [u.curse > 0 ? ['詛', '#d070ff'] : null, u.stun > 0 ? ['定', '#ffb0d0'] : null, u.shield > 0 ? ['盾', '#ffe070'] : null, u.blind > 0 ? ['盲', '#a0a0c0'] : null, u.confuse > 0 ? ['亂', '#ff8060'] : null].filter(Boolean);
  tags.forEach(([t, c], k) => { g.fillStyle = c; g.fillText(t, x - 10 + k * 12, top - 4); });
  // 現在輪到誰、能不能被選
  if (current === u && !over) { g.fillStyle = '#ffe070'; g.beginPath(); g.moveTo(x - 5, top - 16); g.lineTo(x + 5, top - 16); g.lineTo(x, top - 10); g.fill(); }
  if (picking && validTargets().includes(u)) {
    const pulse = 0.5 + 0.5 * Math.sin(now / 150);
    g.strokeStyle = `rgba(255,${u.side === 'ally' ? 230 : 90},${u.side === 'ally' ? 120 : 90},${0.5 + pulse * 0.5})`; g.lineWidth = 2;
    g.strokeRect(x - 26, top - 6, 52, GROUND - top + 10);
  }
}

function draw(now) {
  g.save();
  if (shake > 0) { g.translate(rnd(-1, 1) * shake, rnd(-1, 1) * shake); shake = Math.max(0, shake - 0.3); }
  drawBackground(now);
  for (const u of [...units].sort((a, b) => b.rank - a.rank)) drawUnit(u, now);
  // 特效：紅線、飄字、閃光
  effects = effects.filter((e) => now < e.t0 + e.ms);
  for (const e of effects) {
    const k = (now - e.t0) / e.ms;
    if (e.type === 'text') { g.globalAlpha = 1 - k; g.font = 'bold 14px sans-serif'; g.textAlign = 'center'; g.fillStyle = '#000'; g.fillText(e.text, e.x + 1, e.y - k * 20 + 1); g.fillStyle = e.color; g.fillText(e.text, e.x, e.y - k * 20); g.globalAlpha = 1; }
    if (e.type === 'thread') {
      g.strokeStyle = '#ff3048'; g.lineWidth = 2; g.beginPath();
      const p = Math.min(1, k * 2);
      for (let s = 0; s <= 20; s++) { const t = s / 20 * p; const xx = e.x1 + (e.x2 - e.x1) * t, yy = e.y1 + (e.y2 - e.y1) * t - Math.sin(t * Math.PI) * 30 + Math.sin(t * 20 + now / 50) * 2; s ? g.lineTo(xx, yy) : g.moveTo(xx, yy); }
      g.stroke();
    }
    if (e.type === 'beam') {
      // 權杖金光：從杖頭射到目標
      const p = Math.min(1, k * 3), xx = e.x1 + (e.x2 - e.x1) * p;
      g.globalAlpha = 1 - Math.max(0, k - 0.5) * 2;
      g.fillStyle = '#fff2a0'; g.fillRect(Math.min(e.x1, xx), e.y - 2, Math.abs(xx - e.x1), 4);
      g.fillStyle = '#ffc830'; g.fillRect(Math.min(e.x1, xx), e.y - 1, Math.abs(xx - e.x1), 2);
      g.fillStyle = '#fff'; g.fillRect(xx - 3, e.y - 3, 6, 6);
      g.globalAlpha = 1;
    }
    if (e.type === 'shadow') {
      // 暗影球：紫色一團往前飛，拖著碎片
      const xx = e.x1 + (e.x2 - e.x1) * Math.min(1, k * 1.4), yy = e.y + Math.sin(k * 9) * 3;
      for (let s = 0; s < 6; s++) { g.fillStyle = s % 2 ? '#5a1a7a' : '#c040d0'; g.fillRect(Math.round(xx - s * 7 - 3), Math.round(yy - 3 + Math.sin(now / 60 + s) * 3), 6 - s / 2, 6 - s / 2); }
      g.fillStyle = '#f080ff'; g.fillRect(Math.round(xx - 5), Math.round(yy - 5), 10, 10);
      g.fillStyle = '#2a0838'; g.fillRect(Math.round(xx - 2), Math.round(yy - 2), 4, 4);
    }
    if (e.type === 'fog') {
      // 紅色山霧：一團團紅霧在目標身上鼓起來再散掉
      const a = Math.sin(Math.min(1, k) * Math.PI);
      for (let s = 0; s < 7; s++) {
        const r = 10 + (s % 3) * 5 + a * 6, xx = e.x + Math.cos(s * 2.1 + now / 400) * 16, yy = GROUND - 30 - (s % 4) * 10 + Math.sin(s + now / 300) * 3;
        g.fillStyle = `rgba(${s % 2 ? 200 : 150},${s % 2 ? 40 : 20},${s % 2 ? 60 : 40},${a * 0.45})`;
        g.beginPath(); g.arc(Math.round(xx), Math.round(yy), r, 0, Math.PI * 2); g.fill();
      }
    }
    if (e.type === 'bolt') {
      // 招式飛出去的光球（顏色跟職業走）
      const xx = e.x1 + (e.x2 - e.x1) * Math.min(1, k * 1.5), yy = GROUND - 44 - Math.sin(Math.min(1, k * 1.5) * Math.PI) * 14;
      g.globalAlpha = k < 0.67 ? 1 : 0;
      for (let s = 0; s < 5; s++) { g.fillStyle = e.color; g.globalAlpha *= 0.8; g.fillRect(Math.round(xx - s * 6 - 3), Math.round(yy - 3 + s % 2), 6 - s, 6 - s); }
      g.globalAlpha = k < 0.67 ? 1 : 0; g.fillStyle = '#fff'; g.fillRect(Math.round(xx - 3), Math.round(yy - 3), 6, 6);
      g.globalAlpha = 1;
    }
    if (e.type === 'burst') {
      // 打中時炸開的像素碎片
      const a = 1 - k;
      for (let s = 0; s < 10; s++) {
        const ang = s * 0.63 + e.seed, d = 6 + k * 26;
        g.globalAlpha = a; g.fillStyle = s % 3 ? e.color : '#fff';
        g.fillRect(Math.round(e.x + Math.cos(ang) * d - 2), Math.round(GROUND - 40 + Math.sin(ang) * d * 0.8 - 2), 4, 4);
      }
      g.globalAlpha = 1;
    }
    if (e.type === 'sparkle') {
      // 治療、護盾：綠色十字往上飄
      for (let s = 0; s < 5; s++) {
        const xx = e.x - 16 + s * 8, yy = GROUND - 20 - ((k + s * 0.17) % 1) * 50;
        g.globalAlpha = 1 - k; g.fillStyle = e.color || '#7fe07f';
        g.fillRect(Math.round(xx - 1), Math.round(yy - 3), 2, 6); g.fillRect(Math.round(xx - 3), Math.round(yy - 1), 6, 2);
      }
      g.globalAlpha = 1;
    }
    if (e.type === 'clone') {
      // 暗影分身：半透明的紫色荷魯斯，衝過去再消失
      const xx = e.x1 + (e.x2 - e.x1) * Math.min(1, k * 1.6);
      g.save(); g.globalAlpha = 0.75 * (1 - Math.max(0, k - 0.7) / 0.3); g.filter = 'brightness(0.45) sepia(1) hue-rotate(230deg) saturate(5)';
      drawArt(g, e.art, k < 0.6 ? 'walk' : 'punch', k < 0.6 ? Math.floor(now / 90) % 4 : 2, xx, GROUND, 1);
      g.restore();
    }
    if (e.type === 'flash') { g.fillStyle = e.color ? e.color.replace('A', (1 - k) * 0.6) : `rgba(255,240,200,${(1 - k) * 0.6})`; g.fillRect(0, 0, W, H); }
  }
  // 暗角
  const v = g.createRadialGradient(W / 2, H * 0.6, 80, W / 2, H * 0.6, 260); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.55)');
  g.fillStyle = v; g.fillRect(0, 0, W, H);
  g.restore();
  requestAnimationFrame(draw);
}

// ───── 規則 ─────
function float(u, text, color = '#fff') { effects.push({ type: 'text', x: home(u) + u.ox, y: GROUND - 90, text, color, t0: performance.now(), ms: 900 }); }

async function hit(src, dst, dmg, fixed = false) {
  if (src && src.blind > 0 && !fixed && Math.random() < 0.5) { float(dst, '落空', '#a0a0c0'); return 0; }
  if (dst.evade && !fixed) { dst.evade = false; float(dst, '閃避', '#c0a0ff'); return 0; }
  if (dst.dodge && !fixed && Math.random() < dst.dodge) { float(dst, '閃避', '#c0a0ff'); return 0; }
  if (!fixed) dmg = Math.max(1, dmg - dst.def + rnd(-1, 1));
  if (src && src.id === 'hero' && heroId === 'redgirl' && Math.random() < 0.25) { dst.curse = Math.max(dst.curse, 2); float(dst, '詛咒', '#d070ff'); }
  if (dst.curse > 0) dmg = Math.round(dmg * 1.5);
  if (dst.shield > 0) dmg = Math.ceil(dmg / 2);
  dst.hp -= dmg; dst.flash = performance.now() + 300; dst.hurtUntil = performance.now() + 450; shake = Math.min(6, 2 + dmg / 3);
  float(dst, '-' + dmg);
  if (dst.art) dst.anim = { name: 'hurt', t0: performance.now() };
  if (src && src.id === 'hero') charge = Math.min(100, charge + 25);
  if (dst.id === 'hero') charge = Math.min(100, charge + 15);
  if (dst.hp <= 0) {
    dst.hp = 0; dst.dead = true; dst.deadAt = performance.now() + 300;
    if (dst.art) dst.anim = { name: 'down', t0: performance.now() };
    float(dst, '倒下', '#ff9090');
    if (src && src.id === 'hero' && heroId === 'horusshadow') charge = Math.min(100, charge + 20);
    // 後面的人往前補位
    const row = alive(dst.side).sort((a, b) => a.rank - b.rank);
    await sleep(250);
    await tween(250, () => {}); row.forEach((u, k) => { u.rank = k; });
  }
  return dmg;
}

async function dashTo(u, target, fn) {
  const gap = target.art ? 40 : Math.max(36, UNIT_ART[target.sprite][0] / 2 + 6);
  const dx = home(target) - home(u) + (u.side === 'ally' ? -gap : gap);
  if (u.art) u.anim = { name: 'walk', t0: performance.now() };
  await tween(220, (t) => { u.ox = dx * t; });
  u.atkUntil = performance.now() + 450;
  await fn();
  if (u.art) u.anim = { name: 'walk', t0: performance.now() };
  await tween(220, (t) => { u.ox = dx * (1 - t); });
  if (u.art) u.anim = null;
}

function validTargets() {
  const a = ACTIONS[picking];
  if (!a) return [];
  if (a.target === 'enemyFront') return alive('enemy').filter((u) => u.rank <= 1);
  if (a.target === 'enemy') return alive('enemy');
  if (a.target === 'ally') return alive('ally');
  return [];
}

async function perform(act, target) {
  busy = true; picking = null; renderActs();
  const hero = units[0];
  if (heroId === 'horusshadow') { await performHorus(hero, act, target); busy = false; return endTurn(); }
  if (heroId === 'redgirl') { await performRedgirl(hero, act, target); busy = false; return endTurn(); }
  if (HEROES[heroId].job) {
    const again = await performJob(hero, act, target);
    busy = false;
    if (again && !over && alive('enemy').length) { $('.who').textContent = '再行動一次！'; return renderActs(); }
    return endTurn();
  }
  if (act === 'attack') {
    $('.log').textContent = `月老揍了${target.name}一拳。`;
    await dashTo(hero, target, async () => { hero.anim = { name: 'punch', t0: performance.now() }; await sleep(150); await hit(hero, target, hero.atk); await sleep(250); });
  } else if (act === 'pull') {
    $('.log').textContent = `月老甩出紅線，綁住了${target.name}！`;
    hero.anim = { name: 'cast', t0: performance.now() }; await sleep(330);
    effects.push({ type: 'thread', x1: home(hero) + 20, y1: GROUND - 40, x2: home(target), y2: GROUND - 40, t0: performance.now(), ms: 700 });
    await sleep(380);
    target.curse = 2; float(target, '詛咒', '#d070ff');
    // 拉到最前排
    const row = alive('enemy').sort((a, b) => a.rank - b.rank).filter((u) => u !== target);
    const from = home(target); target.rank = 0; row.forEach((u, k) => { u.rank = k + 1; });
    const d = from - home(target); target.ox = d; await tween(300, (t) => { target.ox = d * (1 - t); });
    cds.pull = ACTIONS.pull.cd + 1;
    charge = Math.min(100, charge + 25);
  } else if (act === 'heal') {
    $('.log').textContent = `月老替${target.name}經營了一下人脈。`;
    hero.anim = { name: 'cast', t0: performance.now() }; await sleep(500);
    target.hp = Math.min(target.maxHp, target.hp + 9); target.shield = 2; float(target, '+9', '#7fe07f'); float(target, '護盾', '#ffe070');
    cds.heal = ACTIONS.heal.cd + 1;
  } else if (act === 'ult') {
    $('.log').textContent = '人口普查！全場敵人都被登記在案。';
    charge = 0; hero.anim = { name: 'cast', t0: performance.now() }; await sleep(400);
    effects.push({ type: 'flash', t0: performance.now(), ms: 400 }); shake = 6;
    for (const e of alive('enemy')) { effects.push({ type: 'thread', x1: home(hero) + 20, y1: GROUND - 40, x2: home(e), y2: GROUND - 40, t0: performance.now(), ms: 600 }); await hit(hero, e, 3, true); if (!e.dead) { e.stun = 1; float(e, '定身', '#ffb0d0'); } await sleep(120); }
  }
  await sleep(300);
  busy = false;
  endTurn();
}

// 荷魯斯之影：權杖金光、暗影諜報（眼睛放暗影）、數據竊取（金光吸血）、分身突襲
async function performHorus(hero, act, target) {
  const tip = () => home(hero) + 44, eyeY = GROUND - 66, staffY = GROUND - 52;
  if (act === 'attack' || act === 'steal') {
    $('.log').textContent = act === 'attack' ? `荷魯斯之影舉起權杖，金光射向${target.name}。` : `荷魯斯之影用金光貫穿${target.name}，竊取它的數據！`;
    hero.anim = { name: 'punch', t0: performance.now() }; await sleep(150);
    effects.push({ type: 'beam', x1: tip(), x2: home(target), y: staffY, t0: performance.now(), ms: act === 'steal' ? 600 : 420 });
    await sleep(140);
    const d = await hit(hero, target, act === 'steal' ? Math.round(hero.atk * 1.2) : hero.atk);
    if (act === 'steal') {
      cds.steal = ACTIONS.steal.cd + 1;
      const back = Math.max(1, Math.round(d * 0.3));
      if (d) { hero.hp = Math.min(hero.maxHp, hero.hp + back); float(hero, '+' + back, '#7fe07f'); }
    }
  } else if (act === 'spy') {
    $('.log').textContent = `荷魯斯之眼盯上了${target.name}，暗影把它的視線吞掉了。`;
    hero.anim = { name: 'cast', t0: performance.now() }; await sleep(260);
    effects.push({ type: 'shadow', x1: home(hero) + 20, x2: home(target), y: eyeY, t0: performance.now(), ms: 520 });
    await sleep(380);
    await hit(hero, target, 2, true);
    if (!target.dead) { target.blind = 3; float(target, '失明', '#a0a0c0'); }
    cds.spy = ACTIONS.spy.cd + 1;
    charge = Math.min(100, charge + 25);
  } else if (act === 'ult') {
    $('.log').textContent = '競品打擊！兩個暗影分身從黑暗裡竄出來。';
    charge = 0; hero.anim = { name: 'cast', t0: performance.now() }; await sleep(380);
    effects.push({ type: 'flash', color: 'rgba(120,40,160,A)', t0: performance.now(), ms: 500 }); shake = 5;
    for (let c = 0; c < 2; c++) {
      for (const e of alive('enemy')) {
        effects.push({ type: 'clone', art: 'horusshadow', x1: home(hero) - 10, x2: home(e) - 40, t0: performance.now(), ms: 520 });
        await sleep(330);
        await hit(hero, e, 3, true);
        await sleep(120);
      }
    }
  }
  await sleep(300);
}

// 紅衣小女孩：撲抓、山徑迷霧（紅霧）、詭異微笑（瞬移抓人）、跟著我走（全場紅霧）
async function performRedgirl(hero, act, target) {
  const fogOn = (u) => effects.push({ type: 'fog', x: home(u), t0: performance.now(), ms: 900 });
  if (act === 'attack') {
    $('.log').textContent = `紅衣小女孩撲向${target.name}。`;
    await dashTo(hero, target, async () => { hero.anim = { name: 'punch', t0: performance.now() }; await sleep(160); await hit(hero, target, hero.atk); await sleep(250); });
  } else if (act === 'mist') {
    $('.log').textContent = '紅衣小女孩揮了揮手，山路起霧了……';
    hero.anim = { name: 'cast', t0: performance.now() }; await sleep(380);
    for (const e of alive('enemy').filter((u) => u.rank <= 1)) { fogOn(e); e.blind = Math.max(e.blind, 2); e.confuse = 2; float(e, '混亂', '#ff8060'); }
    await sleep(500);
    cds.mist = ACTIONS.mist.cd + 1; charge = Math.min(100, charge + 25);
  } else if (act === 'smile') {
    $('.log').textContent = `${target.name}一回頭，紅衣小女孩就站在面前對它笑。`;
    const dx = home(target) - home(hero) - 36;
    await tween(180, (t) => { hero.oy = 0; hero.ghost = 1 - t; });
    hero.ox = dx; float(target, '嘻嘻', '#ff6070');
    await tween(150, (t) => { hero.ghost = t; });
    hero.anim = { name: 'punch', t0: performance.now() }; await sleep(160);
    await hit(hero, target, hero.atk); await sleep(250);
    await tween(150, (t) => { hero.ghost = 1 - t; });
    hero.ox = 0; await tween(150, (t) => { hero.ghost = t; }); hero.ghost = undefined;
    cds.smile = ACTIONS.smile.cd + 1;
  } else if (act === 'ult') {
    $('.log').textContent = '「跟著我走。」紅霧吞沒了整條走廊。';
    charge = 0; hero.anim = { name: 'cast', t0: performance.now() }; await sleep(380);
    effects.push({ type: 'flash', color: 'rgba(160,20,40,A)', t0: performance.now(), ms: 700 }); shake = 4;
    for (const e of alive('enemy')) { fogOn(e); e.confuse = 2; e.curse = 3; float(e, '混亂', '#ff8060'); await sleep(150); }
    await sleep(400);
  }
  await sleep(300);
}

// 把敵人移到最前排或最後排，其他人依序補位
async function moveRank(t, front) {
  const row = alive(t.side).sort((a, b) => a.rank - b.rank).filter((u) => u !== t);
  const from = home(t);
  if (front) { t.rank = 0; row.forEach((u, k) => { u.rank = k + 1; }); } else { row.forEach((u, k) => { u.rank = k; }); t.rank = row.length; }
  const d = from - home(t); t.ox = d; await tween(260, (q) => { t.ox = d * (1 - q); });
}

// 通用職業：普攻借用一張招式圖；技能依職業資料套效果，動作播那招自己的圖
async function performJob(hero, act, target) {
  const art = ART[heroId], a = ACTIONS[act], col = art.color || '#ffe070';
  const burst = (u) => effects.push({ type: 'burst', x: home(u) + u.ox, color: col, seed: Math.random() * 6, t0: performance.now(), ms: 500 });
  if (act === 'attack') {
    $('.log').textContent = `${hero.name}攻擊了${target.name}。`;
    if (art.melee) await dashTo(hero, target, async () => { hero.anim = { name: 'punch', t0: performance.now() }; await sleep(220); burst(target); await hit(hero, target, hero.atk); await sleep(250); });
    else { hero.anim = { name: 'punch', t0: performance.now() }; await sleep(220); effects.push({ type: 'bolt', x1: home(hero) + 20, x2: home(target), color: col, t0: performance.now(), ms: 450 }); await sleep(300); burst(target); await hit(hero, target, hero.atk); }
    await sleep(300); return false;
  }
  const sk = a.sk, fx = sk.fx, anim = act === 's0' ? 's1' : act === 's1' ? 's2' : 'ult';
  $('.log').textContent = act === 'ult' ? `${sk.n}！` : `${hero.name}使出「${sk.n}」${target && target !== hero ? '，目標是' + target.name : ''}。`;
  if (act === 'ult') { charge = 0; effects.push({ type: 'flash', t0: performance.now(), ms: 450 }); shake = 6; }
  else { cds[act] = (sk.cd || 0) + 1; charge = Math.min(100, charge + 25); }
  const area = sideArea(sk, target);
  let dealt = 0;
  const apply = async (t) => {
    if (t.side === 'enemy') {
      for (let h = 0; h < (fx.hits || 1) && !t.dead; h++) {
        if (fx.dmg) { let d = Math.round(hero.atk * fx.dmg); if (fx.lowHpBonus && t.hp < t.maxHp / 2) d = Math.round(d * 1.5); burst(t); dealt += (await hit(hero, t, d)) || 0; if (fx.hits) await sleep(150); }
      }
      if (fx.fixed && !t.dead) { burst(t); dealt += (await hit(hero, t, fx.fixed, true)) || 0; }
      if (t.dead) return;
      if (fx.execute && !t.boss && t.hp <= t.maxHp * fx.execute) { float(t, '處決', '#ff6060'); await hit(hero, t, t.hp, true); return; }
      if (fx.stun) { t.stun = Math.max(t.stun, fx.stun); float(t, '定身', '#ffb0d0'); }
      if (fx.blind) { t.blind = Math.max(t.blind, fx.blind + 1); float(t, '失明', '#a0a0c0'); }
      if (fx.confuse) { t.confuse = Math.max(t.confuse, fx.confuse + 1); float(t, '混亂', '#ff8060'); }
      if (fx.curse) { t.curse = Math.max(t.curse, fx.curse + 1); float(t, '詛咒', '#d070ff'); }
      if (fx.push) await moveRank(t, false);
      if (fx.pull) await moveRank(t, true);
    } else {
      effects.push({ type: 'sparkle', x: home(t), color: fx.shield && !fx.heal ? '#ffe070' : '#7fe07f', t0: performance.now(), ms: 700 });
      if (fx.heal) { const v = Math.min(fx.heal, t.maxHp - t.hp); t.hp += v; float(t, '+' + v, '#7fe07f'); }
      if (fx.shield) { t.shield = Math.max(t.shield, fx.shield + 1); float(t, '護盾', '#ffe070'); }
      if (fx.cleanse) { t.curse = t.stun = t.blind = t.confuse = 0; }
      if (fx.buffAtk) { t.atk += fx.buffAtk; float(t, '攻擊+' + fx.buffAtk, '#ffb040'); }
    }
  };
  const melee = (fx.dmg || fx.fixed) && area.length === 1 && area[0].side === 'enemy' && (sideTarget(sk) === 'enemyFront' || fx.blink);
  if (melee) {
    await dashTo(hero, target, async () => { hero.anim = { name: anim, t0: performance.now() }; await sleep(300); await apply(target); await sleep(300); });
  } else {
    hero.anim = { name: anim, t0: performance.now() }; await sleep(340);
    if (area.length === 1 && area[0].side === 'enemy') { effects.push({ type: 'bolt', x1: home(hero) + 20, x2: home(area[0]), color: col, t0: performance.now(), ms: 450 }); await sleep(300); }
    for (const t of area) { await apply(t); await sleep(120); }
    await sleep(380);
  }
  if (fx.drain && dealt) { const v = Math.max(1, Math.round(dealt * fx.drain)); hero.hp = Math.min(hero.maxHp, hero.hp + v); float(hero, '+' + v, '#7fe07f'); }
  if (fx.teleport) { hero.evade = true; float(hero, '閃身', '#c0a0ff'); }
  if (fx.charge) charge = Math.min(100, charge + fx.charge);
  if (fx.selfHurt) { hero.hp = Math.max(1, hero.hp - fx.selfHurt); float(hero, '-' + fx.selfHurt, '#ff9090'); }
  if (fx.summon) {
    for (let c = 0; c < fx.summon.n; c++) for (const e of alive('enemy')) {
      effects.push({ type: 'clone', art: heroId, x1: home(hero) - 10, x2: home(e) - 40, t0: performance.now(), ms: 520 });
      await sleep(330); await hit(hero, e, 3, true); await sleep(120);
    }
  }
  await sleep(250);
  return !!fx.extraTurn;
}

async function aiTurn(u) {
  if (u.stun > 0) { float(u, '定身中', '#ffb0d0'); u.stun--; await sleep(600); return endTurn(); }
  if (u.confuse > 0) {
    const mates = alive(u.side).filter((m) => m !== u);
    if (mates.length && Math.random() < 0.7) {
      const t = mates[rnd(0, mates.length - 1)];
      $('.log').textContent = `${u.name}被迷霧搞亂，攻擊了自己人${t.name}！`;
      u.atkUntil = performance.now() + 500; float(u, '混亂', '#ff8060'); await sleep(300); await hit(u, t, u.atk); await sleep(400);
      return endTurn();
    }
  }
  const foes = alive(u.side === 'ally' ? 'enemy' : 'ally');
  const reach = u.ranged ? foes : foes.filter((f) => f.rank <= 1);
  const t = reach[rnd(0, reach.length - 1)] || foes[0];
  if (!t) return endTurn();
  $('.log').textContent = `${u.name}攻擊了${t.name}。`;
  if (u.ranged) { u.atkUntil = performance.now() + 600; await sleep(300); await hit(u, t, u.atk); await sleep(400); }
  else await dashTo(u, t, async () => { await hit(u, t, u.atk); await sleep(250); });
  endTurn();
}

function nextRound() {
  turnQueue = units.filter((u) => !u.dead).sort((a, b) => b.spd - a.spd);
  const h0 = units[0];
  if (!h0.dead && h0.regen && h0.hp < h0.maxHp) { const v = Math.min(h0.regen, h0.maxHp - h0.hp); h0.hp += v; float(h0, '+' + v, '#7fe07f'); }
  for (const u of units) { if (u.curse > 0) u.curse--; if (u.shield > 0) u.shield--; if (u.blind > 0) u.blind--; if (u.confuse > 0) u.confuse--; }
  for (const k in cds) if (cds[k] > 0) cds[k]--;
  endTurn(true);
}

function endTurn(fresh) {
  if (!alive('enemy').length) return finish(true);
  if (!alive('ally').some((u) => u.id === 'hero')) return finish(false);
  if (!fresh) turnQueue.shift();
  while (turnQueue.length && turnQueue[0].dead) turnQueue.shift();
  if (!turnQueue.length) return nextRound();
  current = turnQueue[0];
  if (current.id === 'hero') {
    if (current.stun > 0) { current.stun--; float(current, '定身中'); const my = gen; return setTimeout(() => { if (my === gen) endTurn(); }, 600); }
    $('.who').textContent = '輪到你了'; renderActs();
  } else {
    $('.who').textContent = `${current.name}行動中…`; renderActs();
    const c = current, my = gen; setTimeout(() => { if (c === current && my === gen) aiTurn(c); }, 500);
  }
}

function finish(win) {
  over = true; current = null; picking = null;
  $('.who').textContent = win ? '勝利！' : `${HEROES[heroId].name}倒下了`;
  $('.log').textContent = win ? { yuelao: '整層樓的姻緣都登記完畢。', horusshadow: '競品情報全數到手。', redgirl: '大家都跟著她走進霧裡了。' }[heroId] || `${HEROES[heroId].name}打贏了這一批。` : '（正式版這裡會變成靈魂，等引魂犬來救。）';
  const box = $('.acts'); box.innerHTML = '';
  const b = document.createElement('button'); b.className = 'btn primary'; b.textContent = win ? '下一批敵人' : '再打一次'; b.onclick = () => reset(win); box.append(b);
}

function renderActs() {
  const hero = units[0];
  $('.hp').textContent = `${hero.name} 生命 ${hero.hp}/${hero.maxHp}・${HEROES[heroId].gauge} ${charge}%`;
  const box = $('.acts'); box.innerHTML = '';
  const myTurn = current && current.id === 'hero' && !busy && !over;
  for (const [id, a] of Object.entries(ACTIONS)) {
    const cd = cds[id] || 0, ready = myTurn && cd === 0 && (id !== 'ult' || charge >= 100);
    const b = document.createElement('button');
    b.className = 'btn' + (picking === id ? ' active' : '') + (id === 'ult' && charge >= 100 ? ' glow' : '');
    b.textContent = a.name + (cd ? `(${cd})` : '') + (id === 'ult' ? ` ${charge}%` : '');
    b.disabled = !ready;
    b.onclick = () => {
      if (a.target === 'none') return perform(id);
      picking = picking === id ? null : id; renderActs();
      $('.desc').textContent = picking ? a.desc + '　→ 點畫面上發光的目標。' : '';
    };
    box.append(b);
  }
  const wait = document.createElement('button'); wait.className = 'btn'; wait.textContent = '跳過'; wait.disabled = !myTurn;
  wait.onclick = () => { picking = null; endTurn(); }; box.append(wait);
  if (!picking) $('.desc').textContent = myTurn ? '選一個行動。按下技能會先顯示說明，再點目標。' + (HEROES[heroId].passive ? '（被動・' + HEROES[heroId].passive + '）' : '') : '';
}

// 選主角：換人就重開這一批
function renderPick() {
  const box = $('.pick'); box.innerHTML = '';
  for (const [id, h] of Object.entries(HEROES)) {
    const b = document.createElement('button'); b.className = 'btn' + (id === heroId ? ' active' : ''); b.textContent = h.name;
    b.onclick = () => {
      if (id === heroId) return;
      heroId = id; renderPick(); reset();
    };
    box.append(b);
  }
  // 角色介紹：這是哪裡的神魔
  const o = ORIGINS[heroId], J = JOBS[heroId], intro = $('.intro');
  intro.innerHTML = '';
  if (o) intro.append(Object.assign(document.createElement('span'), { className: 'tag origin', textContent: o[0] }), `${J.name}（${J.side}族・${J.title}）：${o[1]}`);
}

cv.addEventListener('pointerdown', (ev) => {
  if (!picking || busy) return;
  const r = cv.getBoundingClientRect(), x = (ev.clientX - r.left) * W / r.width;
  const t = validTargets().sort((a, b) => Math.abs(home(a) - x) - Math.abs(home(b) - x))[0];
  if (t && Math.abs(home(t) - x) < 34) perform(picking, t);
});

let loaded = 0;
preloadArt();
const need = Object.values(ART.yuelao.sheets).length;
const check = setInterval(() => {
  const ready = Object.keys(HEROES).every((h) => Object.keys(ART[h].sheets).every((s) => artSheet(h, s))) && Object.keys(UNIT_ART).every((k) => artSheet('u:' + k, 'pose'));
  if (ready) { clearInterval(check); renderPick(); reset(); requestAnimationFrame(draw); }
}, 50);
</script>
</body>
