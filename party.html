<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>三人小隊試玩</title>
<link rel="stylesheet" href="style.css?v=20261023l">
<style>
  .card .owner { font-size: 11px; font-weight: bold; }
  .party { font-size: 12px; line-height: 1.5; margin: 4px 0; }
  .party .dead { opacity: 0.4; text-decoration: line-through; }
  .ults .btn { font-size: 13px; padding: 8px 2px; }
  .stage { width: 100%; height: auto; border: 2px solid var(--line); background: #0b0a12; touch-action: manipulation; }
  .expbar { position: relative; height: 14px; border: 1px solid #6a5a30; background: #1a1610; margin-bottom: 4px; }
  .expbar i { position: absolute; left: 0; top: 0; bottom: 0; background: #b08a30; transition: width 0.4s; }
  .expbar span { position: relative; display: block; text-align: center; font-size: 11px; line-height: 14px; color: #ffe9b0; }
  .bar { display: flex; justify-content: space-between; align-items: center; margin: 6px 0; font-size: 14px; gap: 8px; }
  .energy { display: inline-block; min-width: 46px; text-align: center; padding: 2px 6px; border: 2px solid var(--gold); color: var(--gold); font-weight: bold; }
  .hand { display: flex; gap: 6px; overflow-x: auto; padding: 10px 2px 8px 10px; min-height: 150px; }
  .screen-battle .hand { flex-wrap: wrap; overflow: visible; row-gap: 12px; }
  .screen-battle .card { flex: 0 0 calc(33.3% - 8px); min-height: 100px; }
  .card { flex: 0 0 104px; min-height: 140px; border: 2px solid var(--line); background: var(--panel); padding: 6px; display: flex; flex-direction: column; gap: 3px; font-size: 12px; line-height: 1.35; text-align: left; color: var(--text); cursor: pointer; position: relative; }
  .card b { font-size: 14px; color: var(--accent); }
  .card .cost { position: absolute; top: -8px; left: -8px; width: 24px; height: 24px; border-radius: 50%; background: #3a3420; border: 2px solid var(--gold); color: var(--gold); font-weight: bold; text-align: center; line-height: 20px; }
  .card.atk { border-color: #a04848; } .card.skill { border-color: #4878a0; } .card.ult { border-color: var(--gold); }
  .card.mine b { color: #ffd070; }
  .card:disabled { opacity: 0.4; }
  .card .who { color: var(--muted); font-size: 11px; }
  .row { display: flex; gap: 6px; }
  .row .btn { flex: 1; padding: 10px 4px; font-size: 15px; }
  .btn.glow { border-color: var(--gold); animation: glow 0.8s infinite alternate; }
  .log { font-size: 13px; color: var(--muted); margin-top: 6px; min-height: 40px; }
  .pick { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
  .pick .btn { flex: 1 0 30%; padding: 8px 4px; font-size: 14px; }
  .pick .btn.active { border-color: var(--gold); background: #3a3420; }
  .panel { border: 2px solid var(--line); background: var(--panel); padding: 10px; margin-top: 8px; }
  .panel h3 { margin-top: 0; }
  .intro { font-size: 13px; line-height: 1.5; margin-top: 10px; }
  .levelup { color: #ffd070; font-size: 13px; }
  .gear { border: 1px solid var(--line); background: var(--panel); padding: 6px 8px; margin: 4px 0; font-size: 13px; }
  .gear small { color: var(--muted); }
  .gear.holy b { color: #ffd070; } .gear.cursed b { color: #d080ff; }
  .gear .warn { color: #ff9090; }
  .gear-actions { display: flex; gap: 6px; margin-top: 4px; color: #7fe07f; }
  .gear-actions .btn { flex: 1; padding: 6px; font-size: 13px; }
  .skills { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; }
  .skill { border: 1px solid var(--line); padding: 4px 6px; font-size: 12px; }
  .skill small { color: var(--muted); }
  .skill.locked { opacity: 0.5; }
  .card.up b { color: #7fe07f; }
  .tagc { display: inline-block; font-size: 10px; padding: 0 4px; margin-right: 3px; border: 1px solid; border-radius: 3px; }
  .tagc.counter { color: #ffb040; } .tagc.exhaust { color: #ff8080; } .tagc.retain { color: #80d0ff; }
  .card.hot { box-shadow: 0 0 8px #ffb040; border-color: #ffb040; }
  .info { position: relative; border: 2px solid var(--line); background: var(--panel); padding: 6px 30px 6px 8px; margin-top: 4px; font-size: 12px; line-height: 1.5; }
  .info .x { position: absolute; top: 2px; right: 2px; background: none; border: 0; color: var(--muted); font-size: 16px; }
  .info .row2 { margin-top: 2px; }
  .skill.pair { cursor: pointer; } .skill.chosen { border-color: var(--gold); }
</style>
</head>
<body>
<div id="app">
  <h2>三人小隊・試玩</h2>
  <p class="muted" style="font-size:13px">三個角色一起上場，三人的牌洗成同一副，每張牌由它的主人出手（卡上有寫是誰的）。每回合 3 點能量、抽 5 張，打不完，要挑。敵人頭上寫著它要打誰（→月 就是打月老），決定要保誰。同一回合三個人都出過牌就「三人合擊」：能量 +1、抽 1 張。隊友倒下，他的牌會變成「魂火」。三個都倒下才算輸。打完一層從三張新牌裡挑一張加進牌組。</p>
  <div class="screen-pick"></div>
  <div class="screen-battle" style="display:none">
    <canvas class="stage" width="384" height="216"></canvas>
    <div class="info" style="display:none"></div>
    <div class="bar"><span class="hp"></span><span class="energy"></span></div>
    <div class="hand"></div>
    <div class="row ults"></div>
    <div class="row" style="margin-top:6px"><button class="btn primary endturn">結束回合</button></div>
    <div class="row" style="margin-top:6px"><button class="btn fast"></button></div>
    <div class="log"></div>
  </div>
  <div class="screen-reward" style="display:none"></div>
  <a class="btn wide" href="./" style="display:block;text-align:center;text-decoration:none;margin-top:10px">回遊戲</a>
</div>
<script src="js/data.js?v=20261023l"></script>
<script src="js/jobs.js?v=20261023l"></script>

<script>
'use strict';
function drawBackground(now) {
  // 後牆：辦公大樓的走廊，門、公告欄、閃爍的燈
  g.fillStyle = '#211d2b'; g.fillRect(0, 0, W, 150);
  g.fillStyle = '#2a2536';
  for (let x = 0; x < W; x += 48) g.fillRect(x, 0, 2, 150);
  for (let i = 0; i < 4; i++) {
    const dx = 20 + i * 96;
    g.fillStyle = '#16131e'; g.fillRect(dx, 62, 40, 88);
    g.fillStyle = '#3a3448'; g.fillRect(dx - 3, 59, 46, 3); g.fillRect(dx - 3, 59, 3, 91); g.fillRect(dx + 40, 59, 3, 91);
    g.fillStyle = '#c8b860'; g.fillRect(dx + 32, 104, 4, 2);
    g.fillStyle = '#3c5a3a'; g.fillRect(dx + 8, 40, 24, 8); g.fillStyle = '#7ae07a'; g.fillRect(dx + 11, 43, 18, 2);
  }
  g.fillStyle = '#4a3a2a'; g.fillRect(126, 70, 36, 26); g.fillStyle = '#d8d0b0';
  for (let k = 0; k < 5; k++) g.fillRect(130 + (k % 3) * 10, 74 + Math.floor(k / 3) * 10, 7, 7);
  // 天花板燈
  for (let i = 0; i < 4; i++) {
    const on = !(i === 2 && Math.floor(now / 140) % 9 === 0);
    g.fillStyle = on ? '#e8f0d0' : '#4a4a40'; g.fillRect(36 + i * 96, 6, 32, 3);
    if (on) { const grd = g.createRadialGradient(52 + i * 96, 10, 2, 52 + i * 96, 60, 90); grd.addColorStop(0, 'rgba(230,240,200,0.10)'); grd.addColorStop(1, 'rgba(230,240,200,0)'); g.fillStyle = grd; g.fillRect(i * 96, 0, 104, 160); }
  }
  // 牆腳＋地板（往前透視的磁磚）
  g.fillStyle = '#3a3448'; g.fillRect(0, 146, W, 4);
  g.fillStyle = '#2a2632'; g.fillRect(0, 150, W, H - 150);
  g.fillStyle = '#221f2a';
  for (let y = 150, k = 0; y < H; y += 8 + k * 2, k++) g.fillRect(0, y, W, 1);
  for (let i = -8; i <= 8; i++) { g.strokeStyle = '#221f2a'; g.beginPath(); g.moveTo(W / 2 + i * 30, 150); g.lineTo(W / 2 + i * 60, H); g.stroke(); }
  // 地上的水漬反光
  g.fillStyle = 'rgba(120,160,220,0.08)'; g.fillRect(60, 200, 90, 4); g.fillRect(250, 206, 70, 3);
}

// 卡牌回合制原型（像殺戮尖塔）：每回合 3 能量、抽 5 張；敵人頭上顯示下一步意圖。
// 死亡就是力量：每個角色的經驗值存在這台手機，死了從頭爬，但等級和解鎖的技能留著。
const W = 384, H = 216, GROUND = 196;
const cv = document.querySelector('.stage'), g = cv.getContext('2d');
g.imageSmoothingEnabled = false;
const $ = (s) => document.querySelector(s);
let gen = 0;
// 節奏：所有等待都乘上 PACE（一般 0.65；按「快轉」再快一倍）
let PACE = 0.65;
try { if (localStorage.getItem('rebirth-card-fast') === '1') PACE = 0.33; } catch (e) { /* 沒差 */ }
const sleep = (ms) => { ms *= PACE; const my = gen; return new Promise((r) => setTimeout(() => { if (my === gen) r(); }, ms)); };
const tween = (ms, fn) => { ms *= PACE; const my = gen; return new Promise((res) => { const t0 = performance.now(); const f = (n) => { if (my !== gen) return; const t = Math.min(1, (n - t0) / ms); fn(t); t < 1 ? requestAnimationFrame(f) : res(); }; requestAnimationFrame(f); }); };
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = rnd(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; };

// ───── 角色技能組：每個角色 10 個技能（7 張主動牌含大招、3 個被動），照傳說設計，靠等級解鎖 ─────
// 牌的欄位：cost 費用、type（atk 攻擊／skill 技能／ult 大招）、lv 解鎖等級、anim 播哪個動作、
// dmg 傷害、hits 連打、aoe 打全體、fixed 無視格擋、block 格擋、heal 回血、draw 抽牌、energy 能量、
// stun 暈眩、weak 虛弱、vuln 易傷、confuse 混亂、cleanse 解除負面、str 力量、upKeys 升級時會變強的欄位
const KITS = {};
// ───── 另外 10 個角色：效果寫成函式（g 是出牌時的工具箱，見 runFx）─────
// 說明文字裡 {D:6} 會換成實際傷害（乘上 ATK_K 與升級倍率），{B:6} 換成實際格擋／回血（只乘升級倍率）
// tags：counter 反制（敵人這回合要攻擊時多出效果）、exhaust 消耗（一場只能用一次）、retain 保留（回合結束不會丟掉）
const C2 = (key, lv, n, cost, type, anim, d, fx, tags = '', asp = '') => ({ key, lv, n, cost, type, anim, d, fx, tags, asp });
const TAG_NAME = { counter: '反制', exhaust: '消耗', retain: '保留' };
const hasTag = (c, t) => (c.tags || '').split(' ').includes(t);
const P2 = (key, lv, n, d) => ({ key, lv, n, d });
Object.assign(KITS, {
  yuelao: { hp: 48, theme: '紅線流：先綁紅線，再打其中一個，傷害會沿著紅線傳給其他被綁的敵人。還能讓有紅線的敵人熱戀互打。', cards: [
    C2('s1', 1, '赤繩繫足', 1, 'atk', 'punch', '用紅繩綁住腳：造成 {D:6} 點傷害，把目標綁上紅線。', (g) => { g.dmg(6); g.link(g.t); }),
    C2('s2', 1, '定婚店', 1, 'skill', 'cast', '獲得 {B:6} 點格擋。敵人這回合要攻擊的話，把要攻擊的敵人全部綁上紅線。', (g) => { g.block(6); for (const f of alive().filter(willAttack)) g.link(f); }, 'counter'),
    C2('ult', 1, '亂點鴛鴦譜', 0, 'ult', 'cast', '翻開鴛鴦譜亂配一通：全體敵人受到 {D:8} 點傷害（無視格擋），全部綁上紅線並陷入熱戀。', (g) => { for (const f of alive()) g.dmgTo(f, 8, true); for (const f of alive()) { g.link(f); f.confuse = 1; } }),
    C2('book', 2, '姻緣簿', 1, 'skill', 'cast', '翻閱姻緣簿：抽 2 張牌，獲得 {B:3} 點格擋。', (g) => { g.draw(2); g.block(3); }, 'retain'),
    C2('thread', 4, '千里姻緣一線牽', 2, 'atk', 'cast', '全體敵人受到 {D:5} 點傷害，然後全部綁上紅線。', (g) => { for (const f of alive()) g.dmgTo(f, 5); for (const f of alive()) g.link(f); }),
    C2('match', 5, '月下撮合', 1, 'skill', 'cast', '有紅線的敵人全部陷入熱戀（下一次攻擊改打自己的另一半），獲得 {B:4} 點格擋。', (g) => { const L = alive().filter((f) => f.link); for (const f of L) { f.confuse = 1; float(f, '熱戀', '#ff90b0'); } if (!L.length) float(g.h, '沒有紅線…', '#a0a0a0'); g.block(4); }),
    C2('cut', 7, '斬斷孽緣', 2, 'atk', 'punch', '造成 {D:11} 點傷害；目標有紅線的話傷害加倍，並剪斷它的紅線。', (g) => { const t = g.t, L = t.link; g.dmg(L ? 22 : 11); if (L && !t.dead) { t.link = 0; float(t, '斬斷', '#ff6080'); } }),
  ], passives: [
    P2('moon', 3, '月光加持', '每回合開始回復 2 點生命。'),
    P2('redstar', 3, '紅鸞星動', '每回合第一次綁上紅線時，抽 1 張牌。'),
    P2('fate', 6, '天作之合', '紅線傳過去的傷害從一半變成全部。'),
    P2('incense', 6, '月老廟香火', '回合開始時，每個有紅線的敵人給你 2 點格擋。'),
    P2('destiny', 8, '姻緣天定', '有紅線的敵人倒下時，你獲得 1 點能量並抽 1 張牌。'),
    P2('wedding', 8, '喜帖', '熱戀或混亂的敵人打到同伴時，傷害加倍。'),
  ] },
  guangong: { hp: 50, theme: '氣勢流：打攻擊牌累積氣勢（上限 10，每回合開始少 2），青龍斬和過五關會吃掉氣勢，越多越痛。', cards: [
    C2('s1', 1, '刺顏良', 1, 'atk', 's1', '青龍刀突刺：造成 {D:7} 點傷害，目標生命低於一半時加五成。氣勢 +1。', (g) => { g.dmg(g.t.hp < g.t.maxHp / 2 ? 10.5 : 7); g.mom(1); }),
    C2('s2', 1, '橫刀立馬', 1, 'skill', 's2', '獲得 {B:7} 點格擋。敵人這回合要攻擊的話，氣勢再 +2。', (g) => { g.block(7); if (g.foeAtk()) g.mom(2); }, 'counter'),
    C2('ult', 1, '青龍斬', 0, 'ult', 'ult', '造成 {D:15} 點傷害，每點氣勢多 4 點，用掉全部氣勢。', (g) => { const m = B.mom; B.mom = 0; g.dmgRaw(g.d(15) + 4 * m); if (m) float(g.h, `氣勢 ${m} 全開！`, '#40d070'); }),
    C2('wine', 2, '溫酒斬華雄', 1, 'skill', 's2', '酒還溫著就回來了：本回合下一張攻擊牌傷害加倍，抽 1 張牌。', (g) => { B.nextAtk = 2; float(g.h, '下一擊加倍', '#ffb040'); g.draw(1); }, 'retain'),
    C2('five', 4, '過五關斬六將', 2, 'atk', 's1', '吃掉 3 點氣勢，連斬 5 次、每次 {D:3} 點。氣勢不到 3 只斬 2 次。', (g) => { const ok = B.mom >= 3; if (ok) B.mom -= 3; else float(g.h, '氣勢不足', '#a0a0a0'); for (let i = 0; i < (ok ? 5 : 2) && alive().length; i++) g.dmg(3); }),
    C2('bone', 5, '刮骨療毒', 1, 'skill', 's2', '一邊下棋一邊刮骨，面不改色：回復 {B:12} 點生命，解除虛弱和易傷，氣勢 +3。', (g) => { g.heal(12); g.cleanse(); g.mom(3); }, 'exhaust'),
    C2('solo', 7, '單刀赴會', 2, 'atk', 'ult', '造成 {D:11} 點傷害、獲得 {B:7} 點格擋；場上只剩一個敵人時都加倍。氣勢 +1。', (g) => { const k = alive().length === 1 ? 2 : 1; if (k > 1) float(g.h, '單刀赴會！', '#40d070'); g.dmg(11 * k); g.block(7 * k); g.mom(1); }),
  ], passives: [
    P2('beard', 3, '美髯公', '生命低於三成時，每次攻擊多 4 點傷害。'),
    P2('redhare', 3, '赤兔馬', '每回合第一張攻擊牌費用 -1。'),
    P2('saint', 6, '武聖', '每打出 3 張攻擊牌，抽 1 張牌。'),
    P2('ride', 6, '千里走單騎', '氣勢上限變 15，回合開始不會減少。'),
    P2('loyal', 8, '忠義', '忠義不會一夜消失：回合開始時格擋只少一半。'),
    P2('yibo', 8, '義薄雲天', '氣勢集滿的瞬間，大招條直接充滿。'),
  ] },
  brigid: { hp: 46, theme: '三相女神：每張牌屬於〔火〕〔鍛〕〔詩〕其中一相。同一回合三相都打出來就「三相合一」：能量 +1、抽 1 張。', cards: [
    C2('s1', 1, '基爾代爾聖火', 1, 'atk', 's2', '〔火〕造成 {D:5} 點傷害，燃燒 2 回合。', (g) => { g.dmg(5); g.est('burn', 2); }, '', '火'),
    C2('s2', 1, '鐵砧鍛造', 1, 'skill', 's1', '〔鍛〕獲得 {B:6} 點格擋。敵人這回合要攻擊的話，再多 {B:4} 點。', (g) => { g.block(g.foeAtk() ? 10 : 6); }, 'counter', '鍛'),
    C2('ult', 1, '詩歌療癒', 0, 'ult', 'ult', '〔詩〕回復 {B:15} 點生命，解除負面狀態，全體敵人燃燒 2 回合。', (g) => { g.heal(15); g.cleanse(); for (const f of alive()) addDebuff(f, 'burn', 2); }, '', '詩'),
    C2('cross', 2, '布麗姬十字', 1, 'skill', 's1', '〔詩〕掛上燈心草十字：這場戰鬥每回合開始回復 {B:2} 點生命。', (g) => { g.st.regen = (g.st.regen || 0) + g.n(2); }, 'exhaust', '詩'),
    C2('flame', 4, '永恆之火', 2, 'atk', 's2', '〔火〕用掉目標全部燃燒，每剩 1 回合造成 {D:4} 點傷害（至少一次）。', (g) => { const b = g.t.burn || 0; g.t.burn = 0; g.dmg(4 * Math.max(1, b)); }, '', '火'),
    C2('well', 5, '聖泉', 1, 'skill', 's1', '〔詩〕喝一口布麗姬的聖泉：抽 2 張牌，回復 {B:3} 點生命。', (g) => { g.draw(2); g.heal(3); }, 'retain', '詩'),
    C2('spring', 7, '聖燭節', 2, 'skill', 'ult', '〔鍛〕春天回來的節日：獲得 {B:8} 點格擋、1 點能量。', (g) => { g.block(8); B.energy++; }, '', '鍛'),
  ], passives: [
    P2('triple', 3, '三面女神', '每回合打出的第一張牌，傷害、格擋、回血都 +2。'),
    P2('kildare', 3, '聖火長明', '燃燒每回合的傷害從 4 點變 6 點。'),
    P2('smith', 6, '鐵匠之手', '打出會給格擋的牌後，下一次攻擊多 3 點傷害。'),

const MAX_LV = 30; // Lv10 技能全解鎖；之後每級生命 +4、每 2 級攻擊 +1
const lvAtk = (lv) => Math.max(0, Math.floor((lv - 10) / 2));
const ATK_K = 1.7, FOE_HP_K = 0.7; // 節奏：我方傷害、敵人血量的倍率
const expNeed = (lv) => 20 + lv * 10; // 從 lv 升到 lv+1 要的經驗
const HEROES = Object.keys(KITS);
const jobGauge = (id) => JOBS[id].side === '神' ? '神力' : '魔力';

// 進度存在這台手機：每個角色各自的經驗值
const PROG_KEY = 'rebirth-card-prog-v1';
let prog = (() => { try { return JSON.parse(localStorage.getItem(PROG_KEY) || '{}'); } catch (e) { return {}; } })();
const saveProg = () => { try { localStorage.setItem(PROG_KEY, JSON.stringify(prog)); } catch (e) { /* 存不了就只在這次有效 */ } };
function levelOf(id) {
  let exp = (prog[id] && prog[id].exp) || 0, lv = 1;
  while (lv < MAX_LV && exp >= expNeed(lv)) { exp -= expNeed(lv); lv++; }
  return { lv, exp, need: lv < MAX_LV ? expNeed(lv) : 0 };
}
const unlockedCards = (id, lv) => KITS[id].cards.filter((c) => c.lv <= lv && c.type !== 'ult');
// 同一個等級有兩個被動時二選一，選擇存在 prog[id].pick[lv]，沒選過就用第一個
function passiveOn(id, p) {
  const same = KITS[id].passives.filter((q) => q.lv === p.lv);
  if (same.length < 2) return true;
  const chosen = prog[id] && prog[id].pick && prog[id].pick[p.lv];
  return chosen ? chosen === p.key : same[0] === p;
}
const hasPassive = (key) => run && heroId && KITS[heroId] && KITS[heroId].passives.some((p) => p.key === key && p.lv <= levelOf(heroId).lv && passiveOn(heroId, p));
// 小隊：heroId 是「現在出手／被打的那個人」。withHero 暫時換人，算完換回來
function withHero(id, fn) { if (!id || id === heroId) return fn(); const was = heroId; heroId = id; try { return fn(); } finally { heroId = was; } }
const anyPassive = (key) => B && B.party.some((u) => !u.dead && withHero(u.job, () => hasPassive(key)));

// 牌的 id：角色.key，升級過的加「+」
function cardById(id) {
  const up = id.endsWith('+'), [job0, key] = id.replace('+', '').split('.');
  const base = job0 === 'combo' ? COMBOS.find((c) => c.key === key) : KITS[job0].cards.find((c) => c.key === key);
  const job = job0 === 'combo' ? base.own : job0;
  const c = { ...base, id, job, up };
  if (base.fx) {
    // 函式型的牌：升級後所有數值 ×1.3
    c.k = up ? 1.3 : 1;
    if (up) c.n += '+';
    c.desc = base.d.replace(/\{([DB]):(\d+)\}/g, (m, t, v) => Math.round(v * (t === 'D' ? ATK_K : 1) * c.k));
    return c;
  }
  // 小黑：攻擊力高一點、一場不要打太久 → 所有傷害乘 ATK_K
  for (const k of ['dmg', 'fixed']) if (c[k]) c[k] = Math.round(c[k] * ATK_K);
  if (up) {
    c.n += '+';
    for (const k of ['dmg', 'fixed', 'block', 'heal']) if (c[k]) c[k] = Math.ceil(c[k] * 1.35);
    if (c.draw) c.draw += 1;
  }
  c.desc = c.d.replace(/\{(\w+)\}/g, (m, k) => c[k]);
  return c;
}

const ROUND = 6;
const ENCOUNTERS = {
  normal: [['zombie', 'printer'], ['shade', 'wisp', 'shade'], ['husk', 'printer', 'wisp'], ['hunter', 'zombie'], ['mirror', 'shade'], ['dog', 'dog', 'wisp'], ['zombie', 'zombie'], ['printer', 'husk'], ['dog', 'shade', 'printer']],

  boss: [['judge'], ['boss']],
};
const pick = (a) => a[rnd(0, a.length - 1)];
function planFloor(n) {
  const f = n + 1;
  if (f % ROUND === 0) return { kind: 'boss', foes: pick(ENCOUNTERS.boss), elite: [], exp: 10, drop: '魔王' };
  if (f % 3 === 0) return { kind: 'elite', foes: pick(ENCOUNTERS.elite), elite: [0], exp: 6, drop: '菁英' };
  if (f > 1 && Math.random() < 0.18) { const foes = pick(ENCOUNTERS.elite); return { kind: 'danger', foes, elite: foes.map((x, i) => i), exp: 15, drop: '危險樓層' }; }
  return { kind: 'normal', foes: pick(ENCOUNTERS.normal), elite: [], exp: 3 };
}

let gear = (() => { try { return JSON.parse(localStorage.getItem(GEAR_KEY)) || null; } catch (e) { return null; } })() || { bag: [], eq: {} };
const saveGear = () => { try { localStorage.setItem(GEAR_KEY, JSON.stringify(gear)); } catch (e) { /* 存不了就只在這次有效 */ } };
const itemOf = (g) => ITEMS[g.id];
// 神族只能用神器、魔族只能用邪物；專屬武器只有本人能用
const kindFor = (id) => JOBS[id].side === '神' ? '神器' : '邪物';
const canUse = (it, id) => it.own ? it.own === id : it.kind === kindFor(id);

// 菁英掉你這一族的神器或邪物；魔王有四成機率掉這個角色的專屬武器
function rollGear(boss) {
  const ex = 'ex_' + heroId;
  if (boss && ITEMS[ex] && Math.random() < 0.4) return { uid: Date.now() + '' + rnd(0, 999), id: ex };
  const pool = Object.keys(ITEMS).filter((k) => !ITEMS[k].own && ITEMS[k].kind === kindFor(heroId));
  return { uid: Date.now() + '' + rnd(0, 999), id: pool[rnd(0, pool.length - 1)] };
}
const statText = (st) => Object.entries(st).map(([k, v]) => `${STATS[k][0]} ${v > 0 ? '+' : ''}${v}${STATS[k][1]}`).join('、');
// 目前穿著、而且這個角色能用的裝備加總
function gearStats(id = heroId) {
  const t = { crit: 0, steal: 0, dodge: 0, atk: 0, hp: 0, guard: 0, regen: 0, fx: {} };
  for (const uid of Object.values(gear.eq)) {
    const g = gear.bag.find((x) => x.uid === uid), it = g && itemOf(g);
    if (!it || !canUse(it, id)) continue;
    for (const [k, v] of Object.entries(it.st)) t[k] += v;
    for (const [k, v] of Object.entries(it.fx)) t.fx[k] = typeof v === 'number' && t.fx[k] ? t.fx[k] + v : v;
  }
  t.dodge = Math.min(t.dodge, 40); // 迴避太高會太無聊
  return t;
}
function gearEl(g, actions) {
  const it = itemOf(g), d = document.createElement('div');
  d.className = 'gear ' + (it.kind === '神器' ? 'holy' : 'cursed');
  const own = it.own ? `・${JOBS[it.own].name}專屬` : '';
  const off = canUse(it, heroId) ? '' : `<br><small class="warn">${it.own ? `只有${JOBS[it.own].name}能用` : `${JOBS[heroId].side}族不能用${it.kind}`}</small>`;
  d.innerHTML = `${lookOf(g.id)[0]} <b>${it.n}</b> <small>${it.kind}・${SLOTS[it.slot]}${own}・${it.from}</small><br><span>${it.d}</span>${off}`;
  const row = document.createElement('div'); row.className = 'gear-actions';
  for (const [label, fn] of actions) { const b = document.createElement('button'); b.className = 'btn'; b.textContent = label; b.onclick = fn; row.append(b); }
  if (actions.length) d.append(row);
  return d;
}
function equip(g) { gear.eq[itemOf(g).slot] = g.uid; saveGear(); }
function showGear(back) {
  showScreen('reward');
  const box = $('.screen-reward'); box.innerHTML = '';
  const T = gearStats();
  box.append(Object.assign(document.createElement('div'), { className: 'panel', innerHTML: `<h3>裝備（${JOBS[heroId].name}）</h3><p class="muted">神族只能用神器，魔族只能用邪物，專屬武器只有本人能用。背包跟著靈魂走：換角色、轉生都會帶著。每 3 層的菁英和每 6 層的魔王會掉落，魔王還可能掉角色的專屬武器。</p><p class="levelup">目前數值加成：${statText(Object.fromEntries(Object.entries(T).filter(([k, v]) => k !== 'fx' && v))) || '沒有'}</p>` }));
  for (const [slot, name] of Object.entries(SLOTS)) {
    const g = gear.bag.find((x) => x.uid === gear.eq[slot]);
    box.append(Object.assign(document.createElement('h3'), { textContent: `${name}：${g ? '' : '（空）'}` }));
    if (g) box.append(gearEl(g, [['卸下', () => { delete gear.eq[slot]; saveGear(); showGear(back); }]]));
  }
  const rest = gear.bag.filter((g) => !Object.values(gear.eq).includes(g.uid));
  box.append(Object.assign(document.createElement('h3'), { textContent: `背包（${rest.length}）` }));
  for (const g of rest) box.append(gearEl(g, [['穿上', () => { equip(g); showGear(back); }], ['丟掉', () => { gear.bag = gear.bag.filter((x) => x !== g); saveGear(); showGear(back); }]]));
  if (!rest.length) box.append(Object.assign(document.createElement('p'), { className: 'muted', textContent: '背包是空的。' }));
  box.append(button('返回', back));
}

// 裝備的樣子：圖示（顯示在角色腳邊）和身上的光效（spark 電光、glow 光暈、mist 氣、twinkle 閃光）
const LOOK = {
  mjolnir: ['⚡', '#a0d8ff', 'spark'], gungnir: ['🔱', '#ffe070', 'twinkle'], ruyi: ['🥢', '#ffc040', 'glow'],
  aegis: ['🛡️', '#ffe070', 'glow'], jinlu: ['🥋', '#a0ffb0', 'glow'], hagoromo: ['🪶', '#e0f0ff', 'twinkle'],
  grail: ['🏆', '#ffe070', 'glow'], yata: ['🪞', '#c0e8ff', 'twinkle'], qiankun: ['⭕', '#ffd070', 'glow'],
  muramasa: ['🗡️', '#ff3040', 'mist'], dracula: ['🦇', '#a01030', 'mist'], annabelle: ['🪆', '#604070', 'mist'],
  monkeypaw: ['🐾', '#a08060', 'mist'], pandora: ['📦', '#b060ff', 'mist'], hope: ['💎', '#4080ff', 'twinkle'],
};
function lookOf(id) {
  const it = ITEMS[id];
  return LOOK[id] || (it.own ? ['★', it.kind === '神器' ? '#ffe070' : '#c060ff', 'glow'] : ['◆', '#fff', 'glow']);
}
// 主角身上穿的、能用的裝備
function wornItems() {
  return Object.values(gear.eq).map((uid) => gear.bag.find((x) => x.uid === uid)).filter((g) => g && canUse(itemOf(g), heroId)).map((g) => g.id);
}
function drawAura(x, now, top) {
  const ids = wornItems();
  ids.forEach((id, n) => {
    const [, col, style] = lookOf(id), strong = ITEMS[id].own ? 1.6 : 1;
    g.save();
    if (style === 'glow') {
      const r = 30 + Math.sin(now / 300 + n) * 3, grd = g.createRadialGradient(x, GROUND - 40, 4, x, GROUND - 40, r * strong);
      grd.addColorStop(0, col + '90'); grd.addColorStop(1, col + '00'); g.fillStyle = grd; g.fillRect(x - 60, GROUND - 100, 120, 100);
    } else if (style === 'spark') {
      g.strokeStyle = col; g.lineWidth = 1;
      for (let k = 0; k < 2 * strong; k++) {
        if (Math.floor(now / 90 + k * 7 + n) % 5) continue;
        let px = x + rnd(-22, 22), py = GROUND - rnd(20, 80); g.beginPath(); g.moveTo(px, py);
        for (let j = 0; j < 3; j++) { px += rnd(-5, 5); py += rnd(3, 7); g.lineTo(px, py); }
        g.stroke();
      }
    } else if (style === 'mist') {
      for (let k = 0; k < 6 * strong; k++) {
        const p = (now / 2200 + k / 6 + n * 0.13) % 1;
        g.globalAlpha = 0.85 * (1 - p); g.fillStyle = col;
        g.fillRect(Math.round(x - 20 + ((k * 37) % 40) + Math.sin(p * 6 + k) * 3), Math.round(GROUND - 10 - p * 70), 4, 4);
      }
    } else {
      for (let k = 0; k < 4 * strong; k++) {
        const ph = (now / 600 + k * 0.37 + n) % 1; if (ph > 0.5) continue;
        g.globalAlpha = 1 - ph * 2; g.fillStyle = col;
        const px = x - 24 + ((k * 53 + n * 17) % 48), py = GROUND - 20 - ((k * 31) % 60);
        g.fillRect(px - 1, py, 3, 1); g.fillRect(px, py - 1, 1, 3);
      }
    }
    g.restore();
  });
  // 角色左邊一排小圖示
  if (ids.length) {
    g.font = '12px sans-serif'; g.textAlign = 'center';
    ids.forEach((id, k) => { g.fillStyle = 'rgba(0,0,0,0.5)'; g.fillRect(x - 46, GROUND - 74 + k * 17, 16, 16); g.fillStyle = '#fff'; g.fillText(lookOf(id)[0], x - 38, GROUND - 61 + k * 17); });
  }
}

let heroId = null, run = null, B = null, effects = [], shake = 0, busy = false, target = null;
let partyIds = null;
const aliveParty = () => B ? B.party.filter((u) => !u.dead) : [];
const PARTY_X = [150, 98, 46];
const FOE_ATK_K = 1.5; // 三個人分攤傷害，敵人打痛一點
const BEST_KEY = 'rebirth-party-best';
const heroMaxHp = (id) => Math.max(10, (KITS[id].hp || 50) + levelOf(id).lv * 4 + gearStats(id).hp);

function startRun(ids) {
  partyIds = ids;
  // 起手牌組：每人兩張 s1、兩張 s2；有合擊組合的話各放一張
  const deck = [];
  for (const id of ids) for (const k of ['s1', 's1', 's2', 's2']) deck.push(id + '.' + k);
  for (const c of COMBOS) if (c.pair.every((x) => ids.includes(x))) deck.push('combo.' + c.key);
  run = { deck, fight: 0, gained: 0, hp: Object.fromEntries(ids.map((id) => [id, heroMaxHp(id)])) };
  // run.G、run.lv 都看「現在出手的人」
  Object.defineProperty(run, 'G', { get: () => gearStats(heroId) });
  Object.defineProperty(run, 'lv', { get: () => levelOf(heroId).lv, set: () => {} });
  startFight();
}

function startFight() {
  gen++;
  // 倒下的隊友在下一層以四分之一生命回來
  const party = partyIds.map((id, i) => {
    const maxHp = heroMaxHp(id), hp = Math.min(maxHp, Math.max(Math.round(maxHp * 0.25), run.hp[id]));
    return { id: 'hero' + i, job: id, side: 'ally', name: JOBS[id].name, art: id, hp, maxHp, block: 0, str: lvAtk(levelOf(id).lv), weak: 0, vuln: 0, x: PARTY_X[i], st: {}, mom: 0, res: 0, ingot: 0, charge: levelOf(id).lv >= 10 ? 50 : 0 };
  });
  const plan = run.plan = planFloor(run.fight), F = plan.foes;
  const loop = Math.floor(run.fight / ROUND);
  const hpK = FOE_HP_K * (1 + run.fight * 0.15) * Math.pow(1.25, loop), atkUp = Math.max(0, run.fight - 1) + loop * 2;
  const foes = F.map((k, i) => ({ id: 'e' + i, side: 'enemy', key: k, ...FOES[k], hp: Math.round(FOES[k].hp * hpK), maxHp: Math.round(FOES[k].hp * hpK), plan: FOES[k].plan.map(([kind, v, n]) => [kind, kind === 'atk' ? Math.round((v + atkUp) * FOE_ATK_K) : v, n]), block: 0, str: 0, weak: 0, vuln: 0, stun: 0, confuse: 0, link: 0, step: rnd(0, 1), x: FOES[k].boss ? 290 : 228 + i * (F.length > 2 ? 56 : 70) }));
  for (const i of plan.elite) {
    const f = foes[i], free = Object.keys(TRAITS).filter((t) => !f[t]), t = pick(free);
    f.name = '精英' + f.name; f.hp = f.maxHp = Math.round(f.maxHp * 1.5); f.exp *= 2; f.elite = true;
    f.plan = f.plan.map(([kind, v, n]) => [kind, kind === 'atk' ? v + 2 : v, n]);
    if (t) f[t] = { armor: 4, thorns: 2, enrage: 3, regen: 4 }[t];
  }
  for (const u of [...party, ...foes]) Object.assign(u, { ox: 0, oy: 0, flash: 0, anim: null, dead: false, atkUntil: 0, hurtUntil: 0 });
  B = { party, foes, draw: shuffle(run.deck.map(cardById)), hand: [], discard: [], energy: 3, turn: 0, nextAtk: 1, atkCount: 0, ups: [], expStart: run.gained, knock: 0, exhausted: [], turnCards: 0, cardCount: 0, firstBonus: 0 };
  // 每個人自己的氣勢、資源、元寶、大招條、狀態
  for (const k of ['mom', 'res', 'ingot', 'charge']) Object.defineProperty(B, k, { get() { return B.hero ? B.hero[k] : 0; }, set(v) { if (B.hero) B.hero[k] = v; } });
  Object.defineProperty(B, 'hero', { get() { return B.party.find((u) => u.job === heroId) || B.party.find((u) => !u.dead) || B.party[0]; } });
  Object.defineProperty(B, 'st', { get() { return B.hero.st; } });
  heroId = partyIds[0];
  target = foes[0];
  effects = [];
  for (const u of party) withHero(u.job, () => {
    const G = run.G, cs = G.fx.curseStart;
    if (cs) for (const f of foes) { if (cs !== 'weak') f.vuln = 2; if (cs !== 'vuln') f.weak = 2; }
    if (cs === 'all') u.weak = 1;
    if (G.fx.stunStart) for (const f of foes) f.stun = 1;
  });

}

// ───── 敵人回合 ─────
async function endTurn() {
  if (busy) return;
  busy = true;
  B.discard.push(...B.hand.filter((c) => !hasTag(c, 'retain'))); B.hand = B.hand.filter((c) => hasTag(c, 'retain')); render();
  // 持續傷害：燃燒、蛇毒、七日之期、詛咒
  for (const f of alive()) {
    let dot = 0;
    if (f.burn > 0) { dot += anyPassive('kildare') ? 6 : 4; f.burn--; }
    if (f.poison > 0) { dot += f.poison + (anyPassive('grudge') ? 1 : 0); f.poison--; }
    if (f.mark > 0) { dot += Math.round(2 * ATK_K); f.mark--; if (!f.mark && anyPassive('sevendays')) { dot += 20; float(f, '第七天', '#ff6060'); } }
    if (f.curse > 0 && anyPassive('legend')) dot += 2 * f.curse;
    if (dot) { damage(null, f, dot, true); await sleep(220); }
  }
  if (!alive().length) return winFight();
  for (const f of alive()) {
    if (f.dead) continue;
    f.block = 0;
    if (f.regen) heal(f, f.regen);
    await sleep(250);
    if (f.stun) { f.stun--; if (!f.stun) f.stoned = 0; float(f, '暈眩中', '#ffb0d0'); f.step++; await sleep(400); continue; }
    const [kind, v, times = 1] = intent(f);
    if (f.seal > 0 && kind !== 'atk') { float(f, '被封印了', '#e0c060'); f.step++; await sleep(400); continue; }
    if (kind === 'atk') {
      let victim = tgtUnit(f);
      heroId = victim.job;
      if (f.confuse) {
        f.confuse = 0;
        const others = alive().filter((o) => o !== f);
        const lover = others.find((o) => o.link);
        victim = f.link && lover ? lover : others.length ? others[rnd(0, others.length - 1)] : f;
        float(f, f.link && lover ? '為愛反目' : '混亂', '#ff8060');
      }
      $('.log').textContent = `${f.name}攻擊${victim.name}！`;
      const dx = victim.side === 'ally' ? victim.x - f.x + 48 : victim === f ? 0 : victim.x - f.x + (victim.x < f.x ? 40 : -40);
      await tween(180, (t) => { f.ox = dx * t; });
      let val = v + f.str;
      if (f.fear) { val = Math.floor(val / 2); f.fear = 0; float(f, '嚇到了', '#c080ff'); }
      if (f.slow > 0) val = Math.floor(val * 0.7);
      if (anyPassive('rice') && f.lost > 0) val = Math.max(0, val - f.lost);
      if (victim.side === 'enemy' && victim !== f && (anyPassive('wedding') || anyPassive('taken'))) val *= 2;
      for (let k = 0; k < times && !f.dead; k++) { f.atkUntil = performance.now() + 300; damage(f, victim, val); await sleep(220); }
      await tween(180, (t) => { f.ox = dx * (1 - t); });
    } else if (kind === 'def') { if (f.fear && anyPassive('tall')) float(f, '嚇到不敢擋', '#c080ff'); else { f.block += v; float(f, '格擋 +' + v, '#a0c8ff'); } }
    else if (kind === 'buff') { f.str += v; float(f, '力量 +' + v, '#ffb040'); }
    else if (kind === 'weak') { const u = tgtUnit(f); u.weak = Math.max(u.weak, v); float(u, '虛弱', '#a0a0c0'); f.atkUntil = performance.now() + 400; }
    else if (kind === 'vuln') { const u = tgtUnit(f); u.vuln = Math.max(u.vuln, v); float(u, '易傷', '#d070ff'); f.atkUntil = performance.now() + 400; }
    f.step++;
    if (f.armor && !f.dead) { f.block += f.armor; float(f, '硬殼 +' + f.armor, '#a0c8ff'); }
    await sleep(300);
    if (!aliveParty().length) return loseRun();
  }
  for (const u of [...B.party, ...B.foes]) {
    if (u.weak > 0) u.weak--; if (u.vuln > 0) u.vuln--;
    if (u.slow > 0) u.slow--; if (u.seal > 0) u.seal--;
    if (u.frost > 0 && !anyPassive('winter')) u.frost--;

  if (!alive().length) return winFight();

}

// 小隊版：牌不會自己加進牌組（從獎勵挑），升級只給被動和生命
function gainExp(id, n) {

  for (let lv = before + 1; lv <= after; lv++) {
    const ps = KITS[id].passives.filter((p) => p.lv === lv);
    if (ps.length > 1) news.push(`${name}被動二選一「${ps.map((p) => p.n).join('／')}」（用第一個，單人版選角畫面可以換）`);
    else for (const p of ps) news.push(`${name}被動「${p.n}」`);

  const box = $('.screen-reward'); box.innerHTML = '';
  showScreen('reward');
  const drop = run.plan.drop;

  const hpText = partyIds.map((id) => `${JOBS[id].name} ${run.hp[id] ? run.hp[id] + '/' + heroMaxHp(id) : '倒下（下一層四分之一生命回來）'}`).join('、');

  })).join('<br>') + `<br><small class="muted">第 ${run.fight + 1} 層・牌堆 ${B.draw.length}${B.nextAtk > 1 ? '・下一擊加倍' : ''}${B.trio ? '・已合擊' : ''}</small>`;
  $('.hp').className = 'hp party';
  $('.energy').textContent = `能量 ${B.energy}`;
  const hand = $('.screen-battle .hand'); hand.innerHTML = '';
  const hot = alive().some(willAttack);
  B.hand.forEach((c, i) => {
    const rep = B.played[(c.job || '') + c.key] || 0, counter = hasTag(c, 'counter') && hot, cost = costOf(c);
    const owner = c.job ? JOBS[c.job].name : '魂火', done = c.job && B.who[c.job];
    const el = cardEl({ ...c, cost }, () => playCard(i), busy || cost > B.energy, [`【${owner}】${c.id && c.id.startsWith('combo') ? '合擊' : ''}${done ? '' : ''}`, counter ? '⚡ 反制發動中' : '', rep ? `用過 ${rep} 次，效果 ${Math.round(Math.max(0.4, 1 - 0.3 * rep) * 100)}%` : ''].filter(Boolean).join('・'));
    if (c.job) el.style.borderLeft = `5px solid ${ART[c.job].color || '#888'}`;
    if (counter) el.classList.add('hot');
    hand.append(el);
  });
  renderInfo();
  const ults = $('.ults'); ults.innerHTML = '';
  for (const u of B.party) {
    const ult = cardById(u.job + '.ult'), b = document.createElement('button');
    b.className = 'btn'; b.textContent = `${u.name[0]}・${ult.n} ${u.charge}%`;
    b.disabled = busy || u.dead || u.charge < 100; b.classList.toggle('glow', !u.dead && u.charge >= 100);
    b.onclick = () => playCard('ult', u.job); ults.append(b);
  }
  $('.endturn').disabled = busy;
  $('.fast').textContent = PACE < 0.5 ? '快轉：開' : '快轉：關';
}
$('.fast').onclick = () => { PACE = PACE < 0.5 ? 0.65 : 0.33; try { localStorage.setItem('rebirth-card-fast', PACE < 0.5 ? '1' : '0'); } catch (e) { /* 沒差 */ } render(); };
$('.endturn').onclick = () => endTurn();

cv.addEventListener('pointerdown', (ev) => {
  if (!B) return;
  const r = cv.getBoundingClientRect(), x = (ev.clientX - r.left) * W / r.width;
  const t = [...aliveParty(), ...alive()].sort((a, b) => Math.abs(a.x - a.ox * 0 - x) - Math.abs(b.x - x))[0];
  if (t && Math.abs(t.x - x) < 36) {
    if (t.side === 'enemy') { target = t; $('.log').textContent = `目標：${t.name}`; }
    infoUnit = t; render();
  }
});

// ───── 點角色看狀態：每個狀態都寫出效果 ─────
let infoUnit = null;
const TRAIT_INFO = {
  armor: (v) => `每次行動完獲得 ${v} 點格擋。`, thorns: (v) => `被你攻擊時，刺回 ${v} 點傷害。`,
  enrage: (v) => `生命掉到一半以下時暴怒，力量 +${v}。`, regen: (v) => `每回合回復 ${v} 點生命。`,
};
function statusRows(u) {
  const R = [], add = (n, d, c = '#e0e0e0') => R.push([n, d, c]);
  if (u.block > 0) add(`格擋 ${u.block}`, u === B.hero ? '先擋掉傷害，你的回合開始時會消失。' : '先擋掉傷害，它下次行動前會消失。', '#a0c8ff');
  if (u.str > 0) add(`力量 ${u.str}`, `每次攻擊多 ${u.str} 點傷害。`, '#ffb040');
  if (u.weak > 0) add(`虛弱（${u.weak} 回合）`, '造成的傷害少兩成五。', '#a0a0c0');
  if (u.vuln > 0) add(`易傷（${u.vuln} 回合）`, '受到的傷害多五成。', '#d070ff');
  if (u.stun > 0) add(`暈眩（${u.stun} 回合）`, '輪到它時不能行動。', '#ffb0d0');
  if (u.confuse > 0) add('混亂／熱戀', '下一次攻擊會打自己人，有紅線的會打另一半。', '#ff8060');
  if (u.link) add('紅線', `受到你的傷害時，其他有紅線的敵人也受 ${hasPassive('fate') ? '全部' : '一半'}傷害。`, '#ff4060');
  if (u.burn > 0) add(`燃燒（${u.burn} 回合）`, `每回合結束受到 ${hasPassive('kildare') ? 6 : 4} 點傷害。永恆之火會把剩下的回合一次燒完。`, DEBUFF.burn[1]);
  if (u.lost > 0) add(`迷途 ${u.lost} 層`, `疊到 5 層就用掉 5 層、混亂一次（下一次攻擊打自己人）。深山迷途每層 7 點傷害${hasPassive('rice') ? '；每層讓它攻擊少 1 點' : ''}。`, DEBUFF.lost[1]);
  if (u.stoned) add('石像', `被石化成石頭，暈眩中${hasPassive('statue') ? '，受到的傷害多五成' : ''}。`, DEBUFF.petrify[1]);
  if (u.poison > 0) add(`蛇毒 ${u.poison} 層`, `每回合結束受到等於層數${hasPassive('grudge') ? ' +1' : ''}的傷害，然後少 1 層。`, DEBUFF.poison[1]);
  if (u.frost > 0) add(`冰霜 ${u.frost} 層`, `${hasPassive('winter') ? '不會自然消退' : '每回合少 1 層'}。冰柱在 3 層以上加倍，碎冰每層 5 點傷害${hasPassive('snowland') ? '；5 層以上受到的傷害多兩成五' : ''}${hasPassive('snownight') ? '；疊到 10 層凍結 2 回合' : ''}。`, DEBUFF.frost[1]);
  if (u.petrify > 0) add(`石化 ${u.petrify} 層`, '疊到 3 層會變成石頭，暈眩 1 回合。', DEBUFF.petrify[1]);
  if (u.fear > 0) add('恐懼', `下一次攻擊傷害減半${hasPassive('tall') ? '，而且不敢加格擋' : ''}。`, DEBUFF.fear[1]);
  if (u.curse > 0) add(`詛咒 ${u.curse} 層`, `紅色披風每層多傷害${hasPassive('legend') ? '；每回合每層受到 2 點傷害' : ''}。`, DEBUFF.curse[1]);
  if (u.mark > 0) add(`標記（${u.mark} 回合）`, `七日之期：每回合結束扣 ${Math.round(2 * ATK_K)} 點生命。`, DEBUFF.mark[1]);
  if (u.seal > 0) add(`封印（${u.seal} 回合）`, '只能普通攻擊，不能防禦或施法。', DEBUFF.seal[1]);
  if (u.slow > 0) add(`遲緩（${u.slow} 回合）`, '攻擊少三成。', DEBUFF.slow[1]);
  for (const k of Object.keys(TRAITS)) if (u[k]) add(`特性：${TRAITS[k][0]}`, TRAIT_INFO[k](u[k]));
  if (u === B.hero) {
    const st = B.st;
    if (B.mom) add(`氣勢 ${B.mom}/${momCap()}`, `青龍斬每點多 4 點傷害，過五關要吃 3 點。${hasPassive('ride') ? '' : '每回合開始少 2 點。'}`, '#40d070');
    if (B.nextAtk > 1) add('下一擊加倍', '本回合下一張攻擊牌傷害加倍。', '#ffb040');
    if (st.nextAtkPlus) add(`下一擊 +${st.nextAtkPlus}`, '下一次攻擊多這麼多傷害。', '#ffb040');
    if (st.vow) add('雪夜之約', '敵人回合沒掉血：下回合能量 +1、多抽 2 張。掉血就破約，再失去 3 點生命。', '#a0e0ff');
    if (st.evade) add('閃避', '下一次被攻擊有一半機率閃開。', '#c0a0ff');
    if (st.mirror) add('鏡面反照', '下一次受到的傷害全部反彈。', '#a0e0ff');
    if (st.hat > 0) add(`白帽遮臉（${st.hat} 回合）`, '受到的傷害少四成。', '#e8e8ff');
    if (st.regen) add(`每回合回血 ${st.regen}`, '你的回合開始時回復生命。', '#7fe07f');
    if (st.temple) add(`土地公廟 ${st.temple}`, '你的回合開始時獲得格擋。', '#a0c8ff');
    if (st.tiger > 0) add(`虎爺（${st.tiger} 回合）`, `每回合咬一個敵人 ${st.tigerDmg} 點。`, '#ffc830');
    const R = KITS[heroId].res; if (R) add(`${R[0]} ${B.res}/${R[1]}`, R[2], '#f0d070');
    if (st.asp) add(`三相：${st.asp}`, '同一回合〔火〕〔鍛〕〔詩〕都打出來，能量 +1、抽 1 張。', '#ff8a30');
    for (const p of KITS[heroId].passives) if (p.lv <= run.lv && passiveOn(heroId, p)) add(`被動：${p.n}`, p.d, '#ffd070');
  }
  return R;
}
function intentText(f) {
  if (f.stun > 0) return '暈眩中，這回合不會行動。';
  const [kind, v, times = 1] = intent(f);
  const who = f.tgt ? JOBS[f.tgt].name : '你';
  if (kind === 'weak' || kind === 'vuln') return `要讓${who}${kind === 'weak' ? '虛弱' : '易傷'} ${v} 回合。`;
  if (kind === 'atk') return `要攻擊${who}：${v + f.str} 點${times > 1 ? ` × ${times} 次` : ''}${f.fear ? '（恐懼中會減半）' : ''}。`;
  return { def: `要防禦：獲得 ${v} 點格擋。`, buff: `要變強：力量 +${v}。`, weak: `要讓你虛弱 ${v} 回合（傷害少兩成五）。`, vuln: `要讓你易傷 ${v} 回合（受到的傷害多五成）。` }[kind];
}
function renderInfo() {
  const box = $('.info');
  if (!infoUnit || infoUnit.dead || !B || ![...B.party, ...B.foes].includes(infoUnit)) { box.style.display = 'none'; return; }
  const u = infoUnit, rows = u.side === 'ally' ? withHero(u.job, () => statusRows(u)) : statusRows(u);
  box.style.display = '';
  box.innerHTML = `<button class="x">✕</button><b>${u.name}</b>${u.boss ? ' <small>魔王</small>' : u.elite ? ' <small>菁英</small>' : ''}　生命 ${u.hp}/${u.maxHp}`
    + (u.side === 'enemy' ? `<div class="row2">下一步：${intentText(u)}</div>` : '')
    + (rows.length ? rows.map(([n, d, c]) => `<div class="row2"><b style="color:${c}">${n}</b>　${d}</div>`).join('') : '<div class="row2 muted">身上沒有狀態。</div>');
  box.querySelector('.x').onclick = () => { infoUnit = null; renderInfo(); };
}

// ───── 畫 ─────
function drawUnit(u, now) {
  const x = u.x + u.ox;
  const white = u.flash > now && Math.floor((u.flash - now) / 60) % 2 === 0;
  if (!u.dead) { g.fillStyle = 'rgba(0,0,0,0.4)'; g.beginPath(); g.ellipse(x, GROUND, u.boss ? 34 : 22, 4, 0, 0, Math.PI * 2); g.fill(); }
  let top;
  if (u.art) {
    let sheet = 'pose', i = 0;
    let A = { walk: ['walk', [100, 100, 100, 100], true], punch: ['punch', [70, 80, 260, 120]], cast: ['cast', [110, 110, 110, 380]], hurt: ['hurt', [150, 300]], down: ['hurt', [150, 200, 99999]] };
    if (ART[u.art].anims) { A = { down: ['hurt', [150, 200, 99999]] }; for (const [k, v] of Object.entries(ART[u.art].anims)) A[k] = [v.sheet, v.ms, v.loop]; }
    if (u.anim && A[u.anim.name]) {
      const [s, ms, loop] = A[u.anim.name]; let t = now - u.anim.t0; const tot = ms.reduce((a, b) => a + b, 0);
      if (loop) t %= tot;
      if (t < tot) { sheet = s; while (t >= ms[i]) t -= ms[i++]; } else u.anim = null;
    }
    if (u.dead && !u.anim) return;
    if (u.side === 'ally') withHero(u.job, () => drawAura(x, now));
    drawArt(g, u.art, sheet, i, x, GROUND + u.oy, 1, { white });
    const mark = ART[u.art].mark;
    if (mark) for (let k = 0; k < 2; k++) { const p = (now / 1800 + k / 2) % 1; drawMark(g, mark, x + (k ? 18 : -28) + Math.sin(p * 6) * 3, GROUND - 50 - p * 40, 2, p < 0.2 ? p * 5 : 1 - (p - 0.2) / 0.8); }
    top = GROUND - ART[u.art].sheets.pose[2] - 6;
  } else {
    const pose = now < u.hurtUntil || u.dead ? 2 : now < u.atkUntil ? 1 : 0;
    const bob = pose === 0 && Math.floor(now / 600 + x) % 2 ? 1 : 0;
    if (u.dead) { const k = Math.max(0, Math.min(1, (now - u.deadAt) / 600)); if (k >= 1) return; g.globalAlpha = 1 - k; }
    drawArt(g, 'u:' + u.key, 'pose', pose, x, GROUND + u.oy + bob, 1, { flip: true, white });
    g.globalAlpha = 1;
    if (u.dead) return;
    top = GROUND - UNIT_ART[u.key][1] - 8;
  }
  g.fillStyle = '#000'; g.fillRect(x - 17, top - 1, 34, 5);
  g.fillStyle = u.side === 'ally' ? '#5fd35f' : '#e05050'; g.fillRect(x - 16, top, Math.max(0, 32 * u.hp / u.maxHp), 3);
  if (u.block > 0) { g.fillStyle = '#4070c0'; g.fillRect(x - 26, top - 3, 9, 9); g.fillStyle = '#fff'; g.font = 'bold 8px sans-serif'; g.textAlign = 'center'; g.fillText(u.block, x - 21.5, top + 4); }
  g.font = 'bold 10px sans-serif'; g.textAlign = 'center';
  const tags = [u.vuln > 0 ? ['傷', '#d070ff'] : null, u.weak > 0 ? ['弱', '#a0a0c0'] : null, u.stun > 0 ? ['暈', '#ffb0d0'] : null, u.confuse > 0 ? ['亂', '#ff8060'] : null, u.str > 0 ? ['力', '#ffb040'] : null, u.link ? ['線', '#ff4060'] : null,
    ...Object.entries(TRAITS).map(([k, [, t]]) => u[k] ? [t, '#e0e0e0'] : null),
    ...Object.entries(DEBUFF).map(([k, [t, c]]) => u[k] > 0 ? [t + (['poison', 'curse', 'frost', 'petrify', 'lost', 'burn'].includes(k) ? u[k] : ''), c] : null)].filter(Boolean);
  // 標籤一個接一個排，置中
  const widths = tags.map(([t]) => g.measureText(t).width + 2), total = widths.reduce((a, b) => a + b, 0);
  let tx = x - total / 2;
  tags.forEach(([t, c], k) => { g.fillStyle = c; g.textAlign = 'left'; g.fillText(t, tx, top + 14); tx += widths[k]; });
  g.textAlign = 'center';
  // 敵人意圖
  if (u.side === 'enemy' && !busy) {
    const [kind, v, times = 1] = intent(u);
    const to = u.tgt && ['atk', 'weak', 'vuln'].includes(kind) ? '→' + JOBS[u.tgt].name[0] : '';
    const txt = (u.stun ? '暈' : kind === 'atk' ? `⚔${v + u.str}${times > 1 ? '×' + times : ''}` : kind === 'def' ? `🛡${v}` : kind === 'buff' ? '力↑' : kind === 'weak' ? '弱化' : '易傷') + (u.stun ? '' : to);
    g.font = 'bold 11px sans-serif'; g.fillStyle = '#000'; g.fillText(txt, x + 1, top - 6); g.fillStyle = kind === 'atk' ? '#ff8080' : '#a0d8ff'; g.fillText(txt, x, top - 7);
  }
  if (u === target && !u.dead) { g.fillStyle = '#ffe070'; g.beginPath(); g.moveTo(x - 5, GROUND + 10); g.lineTo(x + 5, GROUND + 10); g.lineTo(x, GROUND + 4); g.fill(); }
}

function draw(now) {
  g.save();
  if (shake > 0) { g.translate(rnd(-1, 1) * shake, rnd(-1, 1) * shake); shake = Math.max(0, shake - 0.3); }
  drawBackground(now);
  if (B) { for (const f of [...B.foes].reverse()) drawUnit(f, now); for (const u of [...B.party].reverse()) drawUnit(u, now); }
  // 綁著紅線的敵人之間一直連著一條會晃的紅線
  if (B) {
    const L = B.foes.filter((f) => f.link && !f.dead);
    g.strokeStyle = 'rgba(255,48,80,0.7)';
    for (let i = 1; i < L.length; i++) { const a = L[i - 1].x + L[i - 1].ox, b = L[i].x + L[i].ox; g.beginPath(); g.moveTo(a, GROUND - 30); g.quadraticCurveTo((a + b) / 2, GROUND - 22 + Math.sin(now / 300 + i) * 4, b, GROUND - 30); g.stroke(); }
  }
  effects = effects.filter((e) => now < e.t0 + e.ms);
  for (const e of effects) {
    const k = (now - e.t0) / e.ms;
    if (e.type === 'text') { g.globalAlpha = 1 - k; g.font = 'bold 14px sans-serif'; g.textAlign = 'center'; g.fillStyle = '#000'; g.fillText(e.text, e.x + 1, e.y - k * 20 + 1); g.fillStyle = e.color; g.fillText(e.text, e.x, e.y - k * 20); g.globalAlpha = 1; }
    if (e.type === 'flash') { g.fillStyle = `rgba(255,240,200,${(1 - k) * 0.6})`; g.fillRect(0, 0, W, H); }
    if (e.type === 'bolt') {
      const xx = e.x1 + (e.x2 - e.x1) * Math.min(1, k * 1.5), yy = GROUND - 44 - Math.sin(Math.min(1, k * 1.5) * Math.PI) * 14;
      if (k < 0.67) { for (let s = 0; s < 5; s++) { g.globalAlpha = 1 - s * 0.18; g.fillStyle = e.color; g.fillRect(Math.round(xx - s * 6 - 3), Math.round(yy - 3 + s % 2), 6 - s, 6 - s); } g.globalAlpha = 1; g.fillStyle = '#fff'; g.fillRect(Math.round(xx - 3), Math.round(yy - 3), 6, 6); }
    }
    if (e.type === 'burst') {
      for (let s = 0; s < 10; s++) { const ang = s * 0.63 + e.seed, d = 6 + k * 26; g.globalAlpha = 1 - k; g.fillStyle = s % 3 ? e.color : '#fff'; g.fillRect(Math.round(e.x + Math.cos(ang) * d - 2), Math.round(GROUND - 40 + Math.sin(ang) * d * 0.8 - 2), 4, 4); }
      g.globalAlpha = 1;
    }
    if (e.type === 'banner' && k >= 0) {
      const a = k < 0.1 ? k * 10 : k > 0.8 ? (1 - k) * 5 : 1;
      g.globalAlpha = a; g.fillStyle = 'rgba(0,0,0,0.6)'; g.fillRect(0, 70, W, 50);
      g.textAlign = 'center'; g.font = 'bold 20px sans-serif'; g.fillStyle = '#ffd070'; g.fillText(e.text, W / 2, 94);
      g.font = '11px sans-serif'; g.fillStyle = '#fff'; g.fillText(e.sub || '', W / 2, 111); g.globalAlpha = 1;
    }
    if (e.type === 'thread') {
      g.globalAlpha = 1 - k; g.strokeStyle = '#ff3050'; g.lineWidth = 2; g.beginPath();
      g.moveTo(e.x1, GROUND - 40); g.quadraticCurveTo((e.x1 + e.x2) / 2, GROUND - 70 - Math.sin(k * 6) * 6, e.x2, GROUND - 40); g.stroke(); g.globalAlpha = 1; g.lineWidth = 1;
    }
    if (e.type === 'clone') {
      const xx = e.x1 + (e.x2 - e.x1) * Math.min(1, k * 1.6);
      g.save(); g.globalAlpha = 0.75 * (1 - Math.max(0, k - 0.7) / 0.3); g.filter = 'brightness(0.45) sepia(1) hue-rotate(230deg) saturate(5)';
      drawArt(g, e.art, 'walk', Math.floor(now / 90) % (ART[e.art].anims ? 3 : 4), xx, GROUND, 1);
      g.restore();
    }
  }
  const v = g.createRadialGradient(W / 2, H * 0.6, 80, W / 2, H * 0.6, 260); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.55)');
  g.fillStyle = v; g.fillRect(0, 0, W, H);
  g.restore();
  requestAnimationFrame(draw);
}

preloadArt();
const check = setInterval(() => {
  const ready = HEROES.every((h) => Object.keys(ART[h].sheets).every((s) => artSheet(h, s))) && Object.keys(UNIT_ART).every((k) => artSheet('u:' + k, 'pose'));
  if (ready) { clearInterval(check); showPick(); requestAnimationFrame(draw); }
}, 50);
</script>
