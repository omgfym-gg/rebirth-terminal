<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>卡牌戰鬥試玩</title>
<link rel="stylesheet" href="style.css?v=20261023l">
<style>
  .stage { width: 100%; height: auto; border: 2px solid var(--line); background: #0b0a12; touch-action: manipulation; }
  .expbar { position: relative; height: 14px; border: 1px solid #6a5a30; background: #1a1610; margin-bottom: 4px; }
  .expbar i { position: absolute; left: 0; top: 0; bottom: 0; background: #b08a30; transition: width 0.4s; }
  .expbar span { position: relative; display: block; text-align: center; font-size: 11px; line-height: 14px; color: #ffe9b0; }
  .bar { display: flex; justify-content: space-between; align-items: center; margin: 6px 0; font-size: 14px; gap: 8px; }
  .energy { display: inline-block; min-width: 46px; text-align: center; padding: 2px 6px; border: 2px solid var(--gold); color: var(--gold); font-weight: bold; }
  .hand { display: flex; gap: 6px; overflow-x: auto; padding: 10px 2px 8px 10px; min-height: 150px; }
  .screen-battle .hand { flex-wrap: wrap; overflow: visible; row-gap: 12px; }
  .screen-battle .card { flex: 0 0 calc(33.3% - 8px); min-height: 100px; }
  .card { flex: 0 0 104px; min-height: 140px; border: 2px solid var(--line); background: var(--panel); padding: 6px; display: flex; flex-direction: column; gap: 3px; font-size: 12px; line-height: 1.35; text-align: left; color: var(--text); cursor: pointer; position: relative; }
  .card b { font-size: 14px; color: var(--accent); }
  .card .cost { position: absolute; top: -8px; left: -8px; width: 24px; height: 24px; border-radius: 50%; background: #3a3420; border: 2px solid var(--gold); color: var(--gold); font-weight: bold; text-align: center; line-height: 20px; }
  .card.atk { border-color: #a04848; } .card.skill { border-color: #4878a0; } .card.ult { border-color: var(--gold); }
  .card.mine b { color: #ffd070; }
  .card:disabled { opacity: 0.4; }
  .card .who { color: var(--muted); font-size: 11px; }
  .row { display: flex; gap: 6px; }
  .row .btn { flex: 1; padding: 10px 4px; font-size: 15px; }
  .btn.glow { border-color: var(--gold); animation: glow 0.8s infinite alternate; }
  .log { font-size: 13px; color: var(--muted); margin-top: 6px; min-height: 40px; }
  .pick { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
  .pick .btn { flex: 1 0 30%; padding: 8px 4px; font-size: 14px; }
  .pick .btn.active { border-color: var(--gold); background: #3a3420; }
  .panel { border: 2px solid var(--line); background: var(--panel); padding: 10px; margin-top: 8px; }
  .panel h3 { margin-top: 0; }
  .intro { font-size: 13px; line-height: 1.5; margin-top: 10px; }
  .levelup { color: #ffd070; font-size: 13px; }
  .gear { border: 1px solid var(--line); background: var(--panel); padding: 6px 8px; margin: 4px 0; font-size: 13px; }
  .gear small { color: var(--muted); }
  .gear.holy b { color: #ffd070; } .gear.cursed b { color: #d080ff; }
  .gear .warn { color: #ff9090; }
  .gear-actions { display: flex; gap: 6px; margin-top: 4px; color: #7fe07f; }
  .gear-actions .btn { flex: 1; padding: 6px; font-size: 13px; }
  .skills { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; }
  .skill { border: 1px solid var(--line); padding: 4px 6px; font-size: 12px; }
  .skill small { color: var(--muted); }
  .skill.locked { opacity: 0.5; }
  .card.up b { color: #7fe07f; }
</style>
</head>
<body>
<div id="app">
  <h2>卡牌戰鬥・試玩</h2>
  <p class="muted" style="font-size:13px">每回合 3 點能量、抽 5 張牌。敵人頭上會顯示它下一步要做什麼。一路往上爬 6 層樓，打贏拿經驗升級、解鎖專屬技能；死掉從頭爬，但等級會留著。</p>
  <div class="screen-pick"></div>
  <div class="screen-battle" style="display:none">
    <canvas class="stage" width="384" height="216"></canvas>
    <div class="bar"><span class="hp"></span><span class="energy"></span></div>
    <div class="expbar"><i></i><span></span></div>
    <div class="hand"></div>
    <div class="row"><button class="btn ultbtn"></button><button class="btn primary endturn">結束回合</button></div>
    <div class="row" style="margin-top:6px"><button class="btn fast"></button></div>
    <div class="log"></div>
  </div>
  <div class="screen-reward" style="display:none"></div>
  <a class="btn wide" href="./" style="display:block;text-align:center;text-decoration:none;margin-top:10px">回遊戲</a>
</div>
<script src="js/data.js?v=20261023l"></script>
<script src="js/jobs.js?v=20261023l"></script>
<script src="js/sprites.js?v=20261023l"></script>
<script>
'use strict';
function drawBackground(now) {
  // 後牆：辦公大樓的走廊，門、公告欄、閃爍的燈
  g.fillStyle = '#211d2b'; g.fillRect(0, 0, W, 150);
  g.fillStyle = '#2a2536';
  for (let x = 0; x < W; x += 48) g.fillRect(x, 0, 2, 150);
  for (let i = 0; i < 4; i++) {
    const dx = 20 + i * 96;
    g.fillStyle = '#16131e'; g.fillRect(dx, 62, 40, 88);
    g.fillStyle = '#3a3448'; g.fillRect(dx - 3, 59, 46, 3); g.fillRect(dx - 3, 59, 3, 91); g.fillRect(dx + 40, 59, 3, 91);
    g.fillStyle = '#c8b860'; g.fillRect(dx + 32, 104, 4, 2);
    g.fillStyle = '#3c5a3a'; g.fillRect(dx + 8, 40, 24, 8); g.fillStyle = '#7ae07a'; g.fillRect(dx + 11, 43, 18, 2);
  }
  g.fillStyle = '#4a3a2a'; g.fillRect(126, 70, 36, 26); g.fillStyle = '#d8d0b0';
  for (let k = 0; k < 5; k++) g.fillRect(130 + (k % 3) * 10, 74 + Math.floor(k / 3) * 10, 7, 7);
  // 天花板燈
  for (let i = 0; i < 4; i++) {
    const on = !(i === 2 && Math.floor(now / 140) % 9 === 0);
    g.fillStyle = on ? '#e8f0d0' : '#4a4a40'; g.fillRect(36 + i * 96, 6, 32, 3);
    if (on) { const grd = g.createRadialGradient(52 + i * 96, 10, 2, 52 + i * 96, 60, 90); grd.addColorStop(0, 'rgba(230,240,200,0.10)'); grd.addColorStop(1, 'rgba(230,240,200,0)'); g.fillStyle = grd; g.fillRect(i * 96, 0, 104, 160); }
  }
  // 牆腳＋地板（往前透視的磁磚）
  g.fillStyle = '#3a3448'; g.fillRect(0, 146, W, 4);
  g.fillStyle = '#2a2632'; g.fillRect(0, 150, W, H - 150);
  g.fillStyle = '#221f2a';
  for (let y = 150, k = 0; y < H; y += 8 + k * 2, k++) g.fillRect(0, y, W, 1);
  for (let i = -8; i <= 8; i++) { g.strokeStyle = '#221f2a'; g.beginPath(); g.moveTo(W / 2 + i * 30, 150); g.lineTo(W / 2 + i * 60, H); g.stroke(); }
  // 地上的水漬反光
  g.fillStyle = 'rgba(120,160,220,0.08)'; g.fillRect(60, 200, 90, 4); g.fillRect(250, 206, 70, 3);
}

// 卡牌回合制原型（像殺戮尖塔）：每回合 3 能量、抽 5 張；敵人頭上顯示下一步意圖。
// 死亡就是力量：每個角色的經驗值存在這台手機，死了從頭爬，但等級和解鎖的技能留著。
const W = 384, H = 216, GROUND = 196;
const cv = document.querySelector('.stage'), g = cv.getContext('2d');
g.imageSmoothingEnabled = false;
const $ = (s) => document.querySelector(s);
let gen = 0;
// 節奏：所有等待都乘上 PACE（一般 0.65；按「快轉」再快一倍）
let PACE = 0.65;
try { if (localStorage.getItem('rebirth-card-fast') === '1') PACE = 0.33; } catch (e) { /* 沒差 */ }
const sleep = (ms) => { ms *= PACE; const my = gen; return new Promise((r) => setTimeout(() => { if (my === gen) r(); }, ms)); };
const tween = (ms, fn) => { ms *= PACE; const my = gen; return new Promise((res) => { const t0 = performance.now(); const f = (n) => { if (my !== gen) return; const t = Math.min(1, (n - t0) / ms); fn(t); t < 1 ? requestAnimationFrame(f) : res(); }; requestAnimationFrame(f); }); };
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = rnd(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; };

// ───── 角色技能組：每個角色 10 個技能（7 張主動牌含大招、3 個被動），照傳說設計，靠等級解鎖 ─────
// 牌的欄位：cost 費用、type（atk 攻擊／skill 技能／ult 大招）、lv 解鎖等級、anim 播哪個動作、
// dmg 傷害、hits 連打、aoe 打全體、fixed 無視格擋、block 格擋、heal 回血、draw 抽牌、energy 能量、
// stun 暈眩、weak 虛弱、vuln 易傷、confuse 混亂、cleanse 解除負面、str 力量、upKeys 升級時會變強的欄位
const KITS = {
  yuelao: {
    theme: '紅線：被綁上紅線的敵人受傷時，其他有紅線的敵人也會受一半傷害。',
    cards: [
      { key: 's1', n: '情感牽線', lv: 1, cost: 1, type: 'atk', anim: 'punch', dmg: 6, link: 1, d: '造成 {dmg} 點傷害，把目標綁上紅線。' },
      { key: 's2', n: '社群經營', lv: 1, cost: 1, type: 'skill', anim: 'cast', block: 6, heal: 2, d: '獲得 {block} 點格擋，回復 {heal} 點生命。' },
      { key: 'ult', n: '人口普查', lv: 1, type: 'ult', anim: 'cast', fixed: 8, aoe: 1, link: 1, stun: 1, d: '翻開戶口名簿：全體敵人受到 {fixed} 點傷害（無視格擋）、綁上紅線並暈眩。' },
      { key: 'book', n: '姻緣簿', lv: 2, cost: 1, type: 'skill', anim: 'cast', draw: 2, block: 3, d: '翻閱姻緣簿：抽 {draw} 張牌，獲得 {block} 點格擋。' },
      { key: 'thread', n: '千里姻緣一線牽', lv: 4, cost: 2, type: 'atk', anim: 'cast', dmg: 5, aoe: 1, link: 1, d: '全體敵人受到 {dmg} 點傷害，全部綁上紅線。' },
      { key: 'match', n: '月下撮合', lv: 5, cost: 1, type: 'skill', anim: 'cast', matchmake: 1, block: 4, d: '有紅線的敵人全部陷入熱戀（混亂：下一次攻擊打自己的另一半），獲得 {block} 點格擋。' },
      { key: 'cut', n: '斬斷孽緣', lv: 7, cost: 2, type: 'atk', anim: 'punch', dmg: 11, cutLink: 1, d: '造成 {dmg} 點傷害；目標有紅線的話傷害加倍，並剪斷它的紅線。' },
    ],
    passives: [
      { key: 'moon', n: '月光加持', lv: 3, d: '月下老人，月光就是祂的主場：每回合開始回復 2 點生命。' },
      { key: 'fate', n: '天作之合', lv: 6, d: '紅線傳過去的傷害從一半變成全部。' },
      { key: 'destiny', n: '姻緣天定', lv: 8, d: '有紅線的敵人倒下時，你獲得 1 點能量並抽 1 張牌。' },
    ],
  },
  guangong: {
    theme: '武聖：靠青龍偃月刀打出連擊，越危險越強。',
    cards: [
      { key: 's1', n: '信用審查', lv: 1, cost: 1, type: 'atk', anim: 's1', dmg: 7, lowHp: 1, d: '青龍刀突刺：造成 {dmg} 點傷害，目標生命低於一半時加五成。' },
      { key: 's2', n: '安保合約', lv: 1, cost: 1, type: 'skill', anim: 's2', block: 7, d: '橫刀架住：獲得 {block} 點格擋。' },
      { key: 'ult', n: '忠義審判', lv: 1, type: 'ult', anim: 'ult', dmg: 26, d: '青龍斬：對目標造成 {dmg} 點傷害。' },
      { key: 'wine', n: '溫酒斬華雄', lv: 2, cost: 1, type: 'skill', anim: 's2', nextAtk: 2, draw: 1, d: '酒還溫著就回來了：本回合下一張攻擊牌傷害加倍，抽 {draw} 張牌。' },
      { key: 'five', n: '過五關斬六將', lv: 4, cost: 2, type: 'atk', anim: 's1', dmg: 3, hits: 5, d: '連斬 5 次，每次造成 {dmg} 點傷害（力量每次都加）。' },
      { key: 'bone', n: '刮骨療毒', lv: 5, cost: 1, type: 'skill', anim: 's2', heal: 8, cleanse: 1, d: '一邊下棋一邊刮骨：回復 {heal} 點生命，解除虛弱和易傷。' },
      { key: 'solo', n: '單刀赴會', lv: 7, cost: 2, type: 'atk', anim: 'ult', dmg: 11, block: 7, solo: 1, d: '造成 {dmg} 點傷害、獲得 {block} 點格擋；場上只剩一個敵人時兩者都加倍。' },
    ],
    passives: [
      { key: 'beard', n: '美髯公', lv: 3, d: '生命低於三成時，每次攻擊多 4 點傷害。' },
      { key: 'saint', n: '武聖', lv: 6, d: '每打出 3 張攻擊牌，抽 1 張牌。' },
      { key: 'loyal', n: '忠義', lv: 8, d: '忠義不會一夜消失：回合開始時格擋只少一半。' },
    ],
  },
};
// ───── 另外 10 個角色：效果寫成函式（g 是出牌時的工具箱，見 runFx）─────
// 說明文字裡 {D:6} 會換成實際傷害（乘上 ATK_K 與升級倍率），{B:6} 換成實際格擋／回血（只乘升級倍率）
const C2 = (key, lv, n, cost, type, anim, d, fx) => ({ key, lv, n, cost, type, anim, d, fx });
const P2 = (key, lv, n, d) => ({ key, lv, n, d });
Object.assign(KITS, {
  brigid: { hp: 46, theme: '火焰、鍛造與詩歌的女神：會補血、會燒人。', cards: [
    C2('s1', 1, '聖火守護', 1, 'skill', 's1', '獲得 {B:6} 點格擋。', (g) => g.block(6)),
    C2('s2', 1, '鐵砧重生', 1, 'atk', 's2', '造成 {D:6} 點傷害，下一張牌費用 -1。', (g) => { g.dmg(6); g.st.costMinus = 1; }),
    C2('ult', 1, '詩歌療癒', 0, 'ult', 'ult', '回復 {B:15} 點生命，解除負面狀態。', (g) => { g.heal(15); g.cleanse(); }),
    C2('cross', 2, '布麗姬十字', 1, 'skill', 's1', '這場戰鬥每回合開始回復 {B:2} 點生命。', (g) => { g.st.regen = (g.st.regen || 0) + g.n(2); }),
    C2('flame', 4, '永恆之火', 2, 'atk', 's2', '造成 {D:4} 點傷害，燃燒 3 回合。', (g) => { g.dmg(4); g.est('burn', 3); }),
    C2('well', 5, '聖泉', 1, 'skill', 's1', '抽 2 張牌。', (g) => g.draw(2)),
    C2('spring', 7, '春之祭', 2, 'skill', 'ult', '獲得 {B:8} 點格擋、1 點能量。', (g) => { g.block(8); B.energy++; }),
  ], passives: [
    P2('triple', 3, '三面女神', '每回合打出的第一張牌，傷害、格擋、回血都 +2。'),
    P2('smith', 6, '鐵匠之手', '打出會給格擋的牌後，下一張攻擊牌多 3 點傷害。'),
    P2('undying', 8, '聖火不滅', '每場戰鬥第一次倒下時，以三成生命復活。'),
  ] },
  tudigong: { hp: 54, theme: '守護地方的福德正神：很硬，會存元寶、叫虎爺。', cards: [
    C2('s1', 1, '基層維安', 1, 'skill', 's1', '獲得 {B:7} 點格擋。', (g) => g.block(7)),
    C2('s2', 1, '地方情資', 1, 'atk', 's2', '造成 {D:5} 點傷害，抽 1 張牌。', (g) => { g.dmg(5); g.draw(1); }),
    C2('ult', 1, '房地產區劃', 0, 'ult', 'ult', '造成 {D:18} 點傷害，目標虛弱 2 回合。', (g) => { g.dmg(18); g.est('weak', 2); }),
    C2('temple', 2, '土地公廟', 2, 'skill', 's1', '這場戰鬥每回合開始獲得 {B:3} 點格擋。', (g) => { g.st.temple = (g.st.temple || 0) + g.n(3); }),
    C2('ingot', 4, '招財進寶', 1, 'skill', 's2', '得 1 個元寶（集滿 3 個換 1 點能量），抽 1 張牌。', (g) => { g.ingot(1); g.draw(1); }),
    C2('tiger', 5, '虎爺', 2, 'skill', 'ult', '召喚虎爺：之後 3 回合，每回合咬一個敵人 {D:4} 點。', (g) => { g.st.tiger = 3; g.st.tigerDmg = g.d(4); }),
    C2('cane', 7, '拐杖敲地', 1, 'atk', 's1', '造成等於目前格擋一半的傷害（至少 {D:3}）。', (g) => g.dmgRaw(Math.max(g.d(3), Math.floor(g.h.block / 2)))),
  ], passives: [
    P2('fortune', 3, '福德', '打怪的經驗多一成。'),
    P2('guardland', 6, '土地守護', '回合開始時，格擋最多保留 3 點不會消失。'),
    P2('answer', 8, '有求必應', '生命低於四分之一時，每回合多抽 1 張、多 5 點格擋。'),
  ] },
  hermes: { hp: 40, theme: '眾神的信使、小偷之神：抽牌、搶能量、出手快。', cards: [
    C2('s1', 1, '訊息傳遞', 1, 'atk', 's1', '造成 {D:4} 點傷害，抽 1 張牌。', (g) => { g.dmg(4); g.draw(1); }),
    C2('s2', 1, '商業欺詐', 1, 'atk', 's2', '造成 {D:5} 點傷害，目標虛弱 1 回合。', (g) => { g.dmg(5); g.est('weak', 1); }),
    C2('ult', 1, '極速外送', 0, 'ult', 'ult', '連打 4 次，每次 {D:4} 點傷害。', (g) => { for (let i = 0; i < 4; i++) g.dmg(4); }),
    C2('cattle', 2, '偷牛小賊', 0, 'skill', 's1', '出生當天就偷了阿波羅的牛：抽 2 張，隨機丟 1 張。', (g) => { g.draw(2); g.discardRandom(1); }),
    C2('lyre', 4, '七弦琴交易', 1, 'skill', 's2', '隨機丟 1 張牌，得 2 點能量。', (g) => { g.discardRandom(1); B.energy += 2; }),
    C2('guide', 5, '引魂者', 2, 'atk', 'ult', '造成 {D:6} 點傷害；目標生命低於兩成（非魔王）直接帶走。', (g) => { if (!g.t.boss && g.t.hp <= g.t.maxHp * 0.2) g.execute(); else g.dmg(6); }),
    C2('caduceus', 7, '雙蛇杖調停', 1, 'skill', 's2', '目標暈眩：下回合不行動。', (g) => g.est('stun', 1)),
  ], passives: [
    P2('sandals', 3, '神行涼鞋', '每回合多抽 1 張牌。'),
    P2('trade', 6, '商業之神', '每回合打出第 4 張牌時，能量 +1。'),
    P2('herald', 8, '眾神信使', '打出 0 費的牌後，再抽 1 張。'),
  ] },
  dagda: { hp: 60, theme: '凱爾特的「好神」：巨棒一端殺人、一端救人，大鍋吃不完。', cards: [

const MAX_LV = 10;
const ATK_K = 1.7, FOE_HP_K = 0.7; // 節奏：我方傷害、敵人血量的倍率
const expNeed = (lv) => 20 + lv * 10; // 從 lv 升到 lv+1 要的經驗
const HEROES = Object.keys(KITS);
const jobGauge = (id) => JOBS[id].side === '神' ? '神力' : '魔力';

// 進度存在這台手機：每個角色各自的經驗值
const PROG_KEY = 'rebirth-card-prog-v1';
let prog = (() => { try { return JSON.parse(localStorage.getItem(PROG_KEY) || '{}'); } catch (e) { return {}; } })();
const saveProg = () => { try { localStorage.setItem(PROG_KEY, JSON.stringify(prog)); } catch (e) { /* 存不了就只在這次有效 */ } };
function levelOf(id) {
  let exp = (prog[id] && prog[id].exp) || 0, lv = 1;
  while (lv < MAX_LV && exp >= expNeed(lv)) { exp -= expNeed(lv); lv++; }
  return { lv, exp, need: lv < MAX_LV ? expNeed(lv) : 0 };
}
const unlockedCards = (id, lv) => KITS[id].cards.filter((c) => c.lv <= lv && c.type !== 'ult');
const hasPassive = (key) => run && KITS[heroId].passives.some((p) => p.key === key && p.lv <= run.lv);

// 牌的 id：角色.key，升級過的加「+」
function cardById(id) {
  const up = id.endsWith('+'), [job, key] = id.replace('+', '').split('.');
  const base = KITS[job].cards.find((c) => c.key === key);
  const c = { ...base, id, job, up };
  if (base.fx) {
    // 函式型的牌：升級後所有數值 ×1.3
    c.k = up ? 1.3 : 1;
    if (up) c.n += '+';
    c.desc = base.d.replace(/\{([DB]):(\d+)\}/g, (m, t, v) => Math.round(v * (t === 'D' ? ATK_K : 1) * c.k));
    return c;
  }
  // 小黑：攻擊力高一點、一場不要打太久 → 所有傷害乘 ATK_K
  for (const k of ['dmg', 'fixed']) if (c[k]) c[k] = Math.round(c[k] * ATK_K);
  if (up) {
    c.n += '+';
    for (const k of ['dmg', 'fixed', 'block', 'heal']) if (c[k]) c[k] = Math.ceil(c[k] * 1.35);
    if (c.draw) c.draw += 1;
  }
  c.desc = c.d.replace(/\{(\w+)\}/g, (m, k) => c[k]);
  return c;
}

  if (boss && ITEMS[ex] && Math.random() < 0.4) return { uid: Date.now() + '' + rnd(0, 999), id: ex };
  const pool = Object.keys(ITEMS).filter((k) => !ITEMS[k].own && ITEMS[k].kind === kindFor(heroId));

const statText = (st) => Object.entries(st).map(([k, v]) => `${STATS[k][0]} ${v > 0 ? '+' : ''}${v}${STATS[k][1]}`).join('、');
// 目前穿著、而且這個角色能用的裝備加總
function gearStats(id = heroId) {
  const t = { crit: 0, steal: 0, dodge: 0, atk: 0, hp: 0, guard: 0, regen: 0, fx: {} };
  for (const uid of Object.values(gear.eq)) {
    const g = gear.bag.find((x) => x.uid === uid), it = g && itemOf(g);
    if (!it || !canUse(it, id)) continue;
    for (const [k, v] of Object.entries(it.st)) t[k] += v;
    for (const [k, v] of Object.entries(it.fx)) t.fx[k] = typeof v === 'number' && t.fx[k] ? t.fx[k] + v : v;

}
function gearEl(g, actions) {

const LOOK = {

  monkeypaw: ['🐾', '#a08060', 'mist'], pandora: ['📦', '#b060ff', 'mist'], hope: ['💎', '#4080ff', 'twinkle'],

function lookOf(id) {
  const it = ITEMS[id];

function drawAura(x, now, top) {
  const ids = wornItems();
  ids.forEach((id, n) => {
    const [, col, style] = lookOf(id), strong = ITEMS[id].own ? 1.6 : 1;
    g.save();
    if (style === 'glow') {
      const r = 30 + Math.sin(now / 300 + n) * 3, grd = g.createRadialGradient(x, GROUND - 40, 4, x, GROUND - 40, r * strong);
      grd.addColorStop(0, col + '90'); grd.addColorStop(1, col + '00'); g.fillStyle = grd; g.fillRect(x - 60, GROUND - 100, 120, 100);
    } else if (style === 'spark') {
      g.strokeStyle = col; g.lineWidth = 1;
      for (let k = 0; k < 2 * strong; k++) {
        if (Math.floor(now / 90 + k * 7 + n) % 5) continue;
        let px = x + rnd(-22, 22), py = GROUND - rnd(20, 80); g.beginPath(); g.moveTo(px, py);
        for (let j = 0; j < 3; j++) { px += rnd(-5, 5); py += rnd(3, 7); g.lineTo(px, py); }
        g.stroke();
      }
    } else if (style === 'mist') {
      for (let k = 0; k < 6 * strong; k++) {
        const p = (now / 2200 + k / 6 + n * 0.13) % 1;
        g.globalAlpha = 0.85 * (1 - p); g.fillStyle = col;
        g.fillRect(Math.round(x - 20 + ((k * 37) % 40) + Math.sin(p * 6 + k) * 3), Math.round(GROUND - 10 - p * 70), 4, 4);
      }
    } else {
      for (let k = 0; k < 4 * strong; k++) {
        const ph = (now / 600 + k * 0.37 + n) % 1; if (ph > 0.5) continue;
        g.globalAlpha = 1 - ph * 2; g.fillStyle = col;
        const px = x - 24 + ((k * 53 + n * 17) % 48), py = GROUND - 20 - ((k * 31) % 60);
        g.fillRect(px - 1, py, 3, 1); g.fillRect(px, py - 1, 1, 3);

    ids.forEach((id, k) => { g.fillStyle = 'rgba(0,0,0,0.5)'; g.fillRect(x - 46, GROUND - 74 + k * 17, 16, 16); g.fillStyle = '#fff'; g.fillText(lookOf(id)[0], x - 38, GROUND - 61 + k * 17); });

// ───── 狀態 ─────
let heroId = null, run = null, B = null, effects = [], shake = 0, busy = false, target = null;

function startRun(id) {
  heroId = id;
  const L = levelOf(id);
  const maxHp = (KITS[id].hp || 50) + L.lv * 4;
  // 起手牌組：兩張基本招各 4 張，之後解鎖的牌各 1 張
  const deck = [];
  for (const c of unlockedCards(id, L.lv)) for (let k = 0; k < (c.lv === 1 ? 4 : 1); k++) deck.push(id + '.' + c.key);
  const G = gearStats();
  run = { deck, fight: 0, maxHp: Math.max(10, maxHp + G.hp), hp: Math.max(10, maxHp + G.hp), lv: L.lv, gained: 0, G };
  startFight();
}

function startFight() {
  gen++;
  // 爬到一半換了裝備，這裡重算
  const G2 = gearStats(); run.maxHp += G2.hp - run.G.hp; run.hp = Math.max(1, Math.min(run.maxHp, run.hp + G2.hp - run.G.hp)); run.G = G2;
  const hero = { id: 'hero', side: 'ally', name: JOBS[heroId].name, art: heroId, hp: run.hp, maxHp: run.maxHp, block: 0, str: 0, weak: 0, vuln: 0, x: 110 };
  const F = FIGHTS[run.fight].foes;
  // 越往上爬敵人越硬、打越痛
  const hpK = FOE_HP_K * (1 + run.fight * 0.15), atkUp = Math.max(0, run.fight - 1);
  const foes = F.map((k, i) => ({ id: 'e' + i, side: 'enemy', key: k, ...FOES[k], hp: Math.round(FOES[k].hp * hpK), maxHp: Math.round(FOES[k].hp * hpK), plan: FOES[k].plan.map(([kind, v, n]) => [kind, kind === 'atk' ? v + atkUp : v, n]), block: 0, str: 0, weak: 0, vuln: 0, stun: 0, confuse: 0, link: 0, step: rnd(0, 1), x: FOES[k].boss ? 290 : 228 + i * (F.length > 2 ? 56 : 70) }));
  for (const u of [hero, ...foes]) Object.assign(u, { ox: 0, oy: 0, flash: 0, anim: null, dead: false, atkUntil: 0, hurtUntil: 0 });
  B = { hero, foes, draw: shuffle(run.deck.map(cardById)), hand: [], discard: [], energy: 3, charge: run.lv >= 10 ? 50 : 0, turn: 0, nextAtk: 1, atkCount: 0, ups: [], expStart: run.gained, lvStart: run.lv, st: {}, knock: 0, ingot: 0, turnCards: 0, cardCount: 0, firstBonus: 0 };
  target = foes[0];
  effects = [];
  // 開場就發動的神器／邪物
  const cs = run.G.fx.curseStart;
  if (cs) for (const f of foes) { if (cs !== 'weak') f.vuln = 2; if (cs !== 'vuln') f.weak = 2; }
  if (cs === 'all') hero.weak = 1;
  if (run.G.fx.stunStart) for (const f of foes) f.stun = 1;
  showScreen('battle');
  $('.log').textContent = `第 ${run.fight + 1} 層（共 ${FIGHTS.length} 層）：${foes.map((f) => f.name).join('、')}`;
  startTurn();
}

const alive = () => B.foes.filter((f) => !f.dead);
const intent = (f) => f.plan[f.step % f.plan.length];

function drawCards(n) {
  for (let i = 0; i < n; i++) {
    if (B.hand.length >= 9) break;
    if (!B.draw.length) { if (!B.discard.length) break; B.draw = shuffle(B.discard); B.discard = []; }
    B.hand.push(B.draw.pop());
  }
}

function startTurn() {
  B.turn++; B.energy = 3; B.nextAtk = 1; B.turnCards = 0;
  const st = B.st, h = B.hero;
  h.block = hasPassive('loyal') ? Math.floor(h.block / 2) : hasPassive('guardland') ? Math.min(3, h.block) : 0;
  st.turnAtk = 0; st.halfDmg = 0; st.reflect = 0; st.snake = 0;
  if (st.hat > 0) st.hat--;
  if (st.regen) heal(h, st.regen);
  if (st.temple) { h.block += st.temple; float(h, '土地公廟 +' + st.temple, '#a0c8ff'); }
  if (st.tiger > 0 && alive().length) { st.tiger--; const f = alive()[rnd(0, alive().length - 1)]; float(f, '虎爺咬！', '#ffc830'); damage(h, f, st.tigerDmg, true); }
  if (hasPassive('gorgon')) for (const f of alive()) addDebuff(f, 'petrify', 1);
  if (hasPassive('toilet') && B.knock > 0) h.block += 2;
  let extra = 0;
  if (hasPassive('sandals')) extra++;
  if (hasPassive('answer') && h.hp < h.maxHp / 4) { extra++; h.block += 5; float(h, '有求必應', '#ffd070'); }
  if (hasPassive('stalk') && alive().some((f) => f.mark > 0)) extra++;
  if (!alive().length) return winFight();
  if (hasPassive('moon')) heal(B.hero, 2);
  const G = run.G;
  if (G.guard) B.hero.block += G.guard;
  if (G.regen) heal(B.hero, G.regen);
  if (G.fx.selfDmg && B.hero.hp > 1) { const n = Math.min(G.fx.selfDmg, B.hero.hp - 1); B.hero.hp -= n; float(B.hero, `邪物反噬 -${n}`, '#c060ff'); }
  if (B.turn === 1 && G.fx.energy1) { B.energy += G.fx.energy1; float(B.hero, `能量 +${G.fx.energy1}`, '#ffe070'); }
  B.aegisUsed = false;
  drawCards(5 + extra);
  busy = false; render();
}

// ───── 傷害與狀態 ─────
function float(u, text, color = '#fff') { effects.push({ type: 'text', x: u.x + u.ox, y: GROUND - 92, text, color, t0: performance.now(), ms: 900 }); }
function heal(u, v) { v = Math.min(v, u.maxHp - u.hp); if (v > 0) { u.hp += v; float(u, '+' + v, '#7fe07f'); } }

function damage(src, dst, amount, pierce = false, spread = false) {
  if (dst.dead) return 0;
  const fromFoe = dst === B.hero && src && src !== B.hero;
  if (fromFoe && run.G.dodge && Math.random() * 100 < run.G.dodge) { float(dst, '閃避', '#c0a0ff'); return 0; }
  if (fromFoe && run.G.fx.aegis && !B.aegisUsed) { B.aegisUsed = true; src.weak = Math.max(src.weak, 2); float(src, '神盾：虛弱', '#a0a0c0'); }
  const st = B.st;
  if (fromFoe && st.evade) { st.evade = 0; if (Math.random() < 0.5) { float(dst, '閃開', '#c0a0ff'); return 0; } }
  if (fromFoe && st.mirror) { st.mirror = 0; float(dst, '鏡面反照', '#a0e0ff'); setTimeout(() => { if (B && !src.dead) damage(null, src, amount, true); }, 120); return 0; }
  let d = amount;
  if (src && src.weak > 0) d = Math.floor(d * 0.75);
  if (dst.vuln > 0) d = Math.floor(d * 1.5);
  if (fromFoe && hasPassive('kind') && !B.kindUsed) { B.kindUsed = true; d = Math.floor(d / 2); float(dst, '善良之神', '#ffd070'); }
  if (fromFoe && st.halfDmg) d = Math.floor(d / 2);
  if (fromFoe && st.hat > 0) d = Math.floor(d * 0.6);
  if (fromFoe && run.G.fx.armor) d = Math.max(0, d - run.G.fx.armor);
  if (!pierce && dst.block > 0) { const b = Math.min(dst.block, d); dst.block -= b; d -= b; if (b) float(dst, '格擋 ' + b, '#a0c8ff'); }
  if (d <= 0) return 0;
  if (fromFoe) {
    st.hurt = true;
    if (st.reflect && !src.dead) { const back = Math.ceil(d * st.reflect); setTimeout(() => { if (B && !src.dead) damage(null, src, back, true); }, 120); }
    if (st.snake && !src.dead) addDebuff(src, 'poison', 1);
  }

// ───── 出牌 ─────

  if (i === 'ult') B.charge = 0; else { B.energy -= costOf(c); B.st.costMinus = 0; B.hand.splice(i, 1); B.discard.push(c); B.charge = Math.min(100, B.charge + (c.type === 'atk' ? 14 : 9)); }

// ───── 敵人回合 ─────
async function endTurn() {
  if (busy) return;
  busy = true;
  B.discard.push(...B.hand); B.hand = []; render();
  // 持續傷害：燃燒、蛇毒、七日之期、詛咒
  for (const f of alive()) {
    let dot = 0;
    if (f.burn > 0) { dot += 4; f.burn--; }
    if (f.poison > 0) { dot += f.poison + (hasPassive('grudge') ? 1 : 0); f.poison--; }
    if (f.mark > 0) { dot += Math.round(2 * ATK_K); f.mark--; }
    if (f.curse > 0 && hasPassive('legend')) dot += 2 * f.curse;
    if (dot) { damage(null, f, dot, true); await sleep(220); }
  }
  if (!alive().length) return winFight();
  for (const f of alive()) {
    if (f.dead) continue;
    f.block = 0;
    await sleep(250);
    if (f.stun) { f.stun--; float(f, '暈眩中', '#ffb0d0'); f.step++; await sleep(400); continue; }
    const [kind, v, times = 1] = intent(f);
    if (f.seal > 0 && kind !== 'atk') { float(f, '被封印了', '#e0c060'); f.step++; await sleep(400); continue; }
    if (kind === 'atk') {
      let victim = B.hero;
      if (f.confuse) {
        f.confuse = 0;
        const others = alive().filter((o) => o !== f);
        const lover = others.find((o) => o.link);
        victim = f.link && lover ? lover : others.length ? others[rnd(0, others.length - 1)] : f;
        float(f, f.link && lover ? '為愛反目' : '混亂', '#ff8060');
      }
      $('.log').textContent = `${f.name}攻擊${victim === B.hero ? '你' : victim.name}！`;
      const dx = victim === B.hero ? B.hero.x - f.x + 48 : victim === f ? 0 : victim.x - f.x + (victim.x < f.x ? 40 : -40);
      await tween(180, (t) => { f.ox = dx * t; });
      let val = v + f.str;
      if (f.fear) { val = Math.floor(val / 2); f.fear = 0; float(f, '嚇到了', '#c080ff'); }
      if (f.slow > 0) val = Math.floor(val * 0.7);
      for (let k = 0; k < times && !f.dead; k++) { f.atkUntil = performance.now() + 300; damage(f, victim, val); await sleep(220); }
      await tween(180, (t) => { f.ox = dx * (1 - t); });
    } else if (kind === 'def') { if (f.fear && hasPassive('tall')) float(f, '嚇到不敢擋', '#c080ff'); else { f.block += v; float(f, '格擋 +' + v, '#a0c8ff'); } }
    else if (kind === 'buff') { f.str += v; float(f, '力量 +' + v, '#ffb040'); }
    else if (kind === 'weak') { B.hero.weak = Math.max(B.hero.weak, v); float(B.hero, '虛弱', '#a0a0c0'); f.atkUntil = performance.now() + 400; }
    else if (kind === 'vuln') { B.hero.vuln = Math.max(B.hero.vuln, v); float(B.hero, '易傷', '#d070ff'); f.atkUntil = performance.now() + 400; }
    f.step++;
    await sleep(300);
    if (B.hero.hp <= 0) return loseRun();
  }
  for (const u of [B.hero, ...B.foes]) {
    if (u.weak > 0) u.weak--; if (u.vuln > 0) u.vuln--;
    if (u.slow > 0) u.slow--; if (u.seal > 0) u.seal--;
    if (u.frost > 0 && !hasPassive('winter')) u.frost--;
  }
  if (!alive().length) return winFight();
  startTurn();
}

// ───── 經驗、升級、獎勵、死亡 ─────

}

    for (const c of K.cards) if (c.lv === lv) { news.push(`新牌「${c.n}」`); run.deck.push(heroId + '.' + c.key); if (B && !B.over) B.hand.push(cardById(heroId + '.' + c.key)); }

}
function levelUpHtml(r) {
  return r.after > r.before ? `<p class="levelup">升級！Lv ${r.before} → Lv ${r.after}${r.news.length ? '<br>解鎖：' + r.news.join('、') : ''}</p>` : '';
}

function winFight() {

    while (gear.bag.length > 30) { const old = gear.bag.find((g) => !Object.values(gear.eq).includes(g.uid)); gear.bag.splice(gear.bag.indexOf(old), 1); }

    const el = gearEl(it, [['立刻穿上', () => { equip(it); el.querySelector('.gear-actions').textContent = '已穿上 ✓'; }]]);
    box.append(el);
    if (cur) box.append(Object.assign(document.createElement('p'), { className: 'muted', textContent: `目前的${SLOTS[slot]}：${itemOf(cur).n}。不穿的話會放進背包。` }));
  };
  if (run.fight >= FIGHTS.length) {
    box.innerHTML = `<div class="panel"><h3>登頂！</h3><p>${JOBS[heroId].name}打倒了考績審判官。這一世獲得 ${run.gained} 經驗，現在 ${expLine()}。</p>${levelUpHtml(r)}</div>`;
    dropBox();
    box.append(button('再爬一次', () => showPick()));
    return;
  }
  run.hp = Math.min(run.maxHp, run.hp + Math.round(run.maxHp * 0.15));
  box.append(Object.assign(document.createElement('div'), { className: 'panel', innerHTML: `<h3>贏了！這層 +${got} 經驗</h3><p class="muted">${expLine()}，生命回復一成半（${run.hp}/${run.maxHp}）。</p>${levelUpHtml(r)}` }));
  dropBox();
  box.append(Object.assign(document.createElement('p'), { textContent: '選一個獎勵：' }));
  // 獎勵：加一張自己已解鎖的牌，或把牌組裡一張牌升級
  const pool = shuffle(unlockedCards(heroId, run.lv).map((c) => heroId + '.' + c.key)).slice(0, 2);
  const upable = shuffle([...new Set(run.deck.filter((id) => !id.endsWith('+')))]);
  const hand = document.createElement('div'); hand.className = 'hand';
  for (const id of pool) hand.append(cardEl(cardById(id), () => { run.deck.push(id); startFight(); }, false, '加入牌組'));
  if (upable.length) {
    const id = upable[0], c = cardById(id + '+');
    hand.append(cardEl(c, () => { run.deck[run.deck.indexOf(id)] = id + '+'; startFight(); }, false, '升級一張'));
  }
  box.append(hand, button('都不要，直接上樓', () => startFight()));
}

function loseRun() {
  busy = true; B.over = true;
  const r = gainExp(5); // 死亡也是一種經驗
  setTimeout(() => {
    showScreen('reward');
    const box = $('.screen-reward');
    box.innerHTML = `<div class="panel"><h3>${JOBS[heroId].name}倒下了（第 ${run.fight + 1} 層）</h3><p>死亡就是力量：這一世共獲得 ${run.gained} 經驗（含死亡的 5 點），等級和解鎖的技能都會帶到下一世。現在 ${expLine()}。</p>${levelUpHtml(r)}</div>`;
    box.append(button('轉生，再爬一次', () => showPick()));
  }, 700);
}

// ───── 畫面 ─────
function showScreen(name) {
  for (const s of ['pick', 'battle', 'reward']) $('.screen-' + s).style.display = s === name ? '' : 'none';
  window.scrollTo(0, 0);
}
function button(text, fn, cls = 'btn wide') { const b = document.createElement('button'); b.className = cls; b.textContent = text; b.style.marginTop = '8px'; b.onclick = fn; return b; }
function cardEl(c, onclick, disabled = false, note = '') {
  const b = document.createElement('button');
  b.className = `card ${c.type}${c.up ? ' up' : ''}`;
  b.disabled = disabled;
  b.innerHTML = `<span class="cost">${c.type === 'ult' ? '★' : c.cost}</span><b>${c.n}</b>${note ? `<span class="who">${note}</span>` : ''}<span>${c.desc}</span>`;
  b.onclick = onclick;
  return b;
}

function showPick() {
  gen++; busy = false; B = null;
  showScreen('pick');
  const box = $('.screen-pick'); box.innerHTML = '';
  box.append(Object.assign(document.createElement('h3'), { textContent: '轉生成誰？' }));
  const pick = document.createElement('div'); pick.className = 'pick';
  let sel = heroId && HEROES.includes(heroId) ? heroId : HEROES[0];
  const intro = document.createElement('div'); intro.className = 'intro';
  const paint = () => {
    heroId = sel; // 裝備畫面看的是目前選的角色
    pick.querySelectorAll('.btn').forEach((b) => b.classList.toggle('active', b.dataset.id === sel));
    const J = JOBS[sel], o = ORIGINS[sel], K = KITS[sel], L = levelOf(sel);
    intro.innerHTML = '';
    if (o) intro.append(Object.assign(document.createElement('span'), { className: 'tag origin', textContent: o[0] }), `${J.name}（${J.side}族）：${o[1]}`);
    intro.append(Object.assign(document.createElement('p'), { className: 'levelup', textContent: `${expLine(sel)}　${K.theme}` }));
    const list = document.createElement('div'); list.className = 'skills';
    const rows = [...K.cards.map((c) => ({ ...cardById(sel + '.' + c.key), kind: c.type === 'ult' ? '大招' : `${c.cost} 費` })), ...K.passives.map((p) => ({ ...p, desc: p.d, kind: '被動' }))].sort((a, b) => a.lv - b.lv);
    for (const s of rows) {
      const open = s.lv <= L.lv;
      list.append(Object.assign(document.createElement('div'), { className: 'skill' + (open ? '' : ' locked'), innerHTML: `<b>${open ? '' : '🔒 '}${s.n}</b> <small>${s.kind}・Lv ${s.lv}</small><br><span>${open ? s.desc : `Lv ${s.lv} 解鎖：` + s.desc}</span>` }));
    }
    intro.append(list);
  };
  for (const id of HEROES) {
    const b = document.createElement('button'); b.className = 'btn'; b.dataset.id = id; b.textContent = `${JOBS[id].name} Lv${levelOf(id).lv}`;
    b.onclick = () => { sel = id; paint(); }; pick.append(b);
  }
  const soon = Object.keys(ART).filter((k) => JOBS[k] && !KITS[k]).map((k) => JOBS[k].name);
  box.append(pick, Object.assign(document.createElement('p'), { className: 'muted', style: 'font-size:12px', textContent: `技能設計中：${soon.join('、')}` }), button('就是你了，開始爬樓！', () => startRun(sel), 'btn primary wide'), button(`裝備（背包 ${gear.bag.length} 件）`, () => showGear(showPick)), intro);
  paint();
}

function render() {
  if (!B) return;
  const h = B.hero;
  $('.hp').textContent = `${h.name} Lv${run.lv} 生命 ${h.hp}/${h.maxHp}${h.block ? `・格擋 ${h.block}` : ''}${B.nextAtk > 1 ? '・下一擊加倍' : ''}・牌堆 ${B.draw.length}`;
  $('.energy').textContent = `能量 ${B.energy}/3`;
  const hand = $('.screen-battle .hand'); hand.innerHTML = '';
  B.hand.forEach((c, i) => hand.append(cardEl({ ...c, cost: costOf(c) }, () => playCard(i), busy || costOf(c) > B.energy)));
  const ult = cardById(heroId + '.ult');
  const ub = $('.ultbtn'); ub.textContent = `${ult.n} ${B.charge}%`; ub.disabled = busy || B.charge < 100; ub.classList.toggle('glow', B.charge >= 100);
  ub.onclick = () => playCard('ult');
  $('.endturn').disabled = busy;
  const L = levelOf(heroId);
  $('.expbar i').style.width = (L.need ? 100 * L.exp / L.need : 100) + '%';
  $('.expbar span').textContent = L.need ? `Lv ${L.lv}　經驗 ${L.exp}/${L.need}` : `Lv ${L.lv}（滿級）`;
  $('.fast').textContent = PACE < 0.5 ? '快轉：開' : '快轉：關';
}
$('.fast').onclick = () => { PACE = PACE < 0.5 ? 0.65 : 0.33; try { localStorage.setItem('rebirth-card-fast', PACE < 0.5 ? '1' : '0'); } catch (e) { /* 沒差 */ } render(); };
$('.endturn').onclick = () => endTurn();

cv.addEventListener('pointerdown', (ev) => {
  if (!B) return;
  const r = cv.getBoundingClientRect(), x = (ev.clientX - r.left) * W / r.width;
  const t = alive().sort((a, b) => Math.abs(a.x - x) - Math.abs(b.x - x))[0];
  if (t && Math.abs(t.x - x) < 36) { target = t; $('.log').textContent = `目標：${t.name}`; }
});

// ───── 畫 ─────
function drawUnit(u, now) {
  const x = u.x + u.ox;
  const white = u.flash > now && Math.floor((u.flash - now) / 60) % 2 === 0;
  if (!u.dead) { g.fillStyle = 'rgba(0,0,0,0.4)'; g.beginPath(); g.ellipse(x, GROUND, u.boss ? 34 : 22, 4, 0, 0, Math.PI * 2); g.fill(); }
  let top;
  if (u.art) {
    let sheet = 'pose', i = 0;
    let A = { walk: ['walk', [100, 100, 100, 100], true], punch: ['punch', [70, 80, 260, 120]], cast: ['cast', [110, 110, 110, 380]], hurt: ['hurt', [150, 300]], down: ['hurt', [150, 200, 99999]] };
    if (ART[u.art].anims) { A = { down: ['hurt', [150, 200, 99999]] }; for (const [k, v] of Object.entries(ART[u.art].anims)) A[k] = [v.sheet, v.ms, v.loop]; }
    if (u.anim && A[u.anim.name]) {
      const [s, ms, loop] = A[u.anim.name]; let t = now - u.anim.t0; const tot = ms.reduce((a, b) => a + b, 0);
      if (loop) t %= tot;
      if (t < tot) { sheet = s; while (t >= ms[i]) t -= ms[i++]; } else u.anim = null;
    }
    if (u.dead && !u.anim) return;
    if (u.side === 'ally') drawAura(x, now);
    drawArt(g, u.art, sheet, i, x, GROUND + u.oy, 1, { white });
    const mark = ART[u.art].mark;
    if (mark) for (let k = 0; k < 2; k++) { const p = (now / 1800 + k / 2) % 1; drawMark(g, mark, x + (k ? 18 : -28) + Math.sin(p * 6) * 3, GROUND - 50 - p * 40, 2, p < 0.2 ? p * 5 : 1 - (p - 0.2) / 0.8); }
    top = GROUND - ART[u.art].sheets.pose[2] - 6;
  } else {
    const pose = now < u.hurtUntil || u.dead ? 2 : now < u.atkUntil ? 1 : 0;
    const bob = pose === 0 && Math.floor(now / 600 + x) % 2 ? 1 : 0;
    if (u.dead) { const k = Math.max(0, Math.min(1, (now - u.deadAt) / 600)); if (k >= 1) return; g.globalAlpha = 1 - k; }
    drawArt(g, 'u:' + u.key, 'pose', pose, x, GROUND + u.oy + bob, 1, { flip: true, white });
    g.globalAlpha = 1;
    if (u.dead) return;
    top = GROUND - UNIT_ART[u.key][1] - 8;
  }
  g.fillStyle = '#000'; g.fillRect(x - 17, top - 1, 34, 5);
  g.fillStyle = u.side === 'ally' ? '#5fd35f' : '#e05050'; g.fillRect(x - 16, top, Math.max(0, 32 * u.hp / u.maxHp), 3);
  if (u.block > 0) { g.fillStyle = '#4070c0'; g.fillRect(x - 26, top - 3, 9, 9); g.fillStyle = '#fff'; g.font = 'bold 8px sans-serif'; g.textAlign = 'center'; g.fillText(u.block, x - 21.5, top + 4); }
  g.font = 'bold 10px sans-serif'; g.textAlign = 'center';
  const tags = [u.vuln > 0 ? ['傷', '#d070ff'] : null, u.weak > 0 ? ['弱', '#a0a0c0'] : null, u.stun > 0 ? ['暈', '#ffb0d0'] : null, u.confuse > 0 ? ['亂', '#ff8060'] : null, u.str > 0 ? ['力', '#ffb040'] : null, u.link ? ['線', '#ff4060'] : null,
    ...Object.entries(DEBUFF).map(([k, [t, c]]) => u[k] > 0 ? [t + (['poison', 'curse', 'frost', 'petrify'].includes(k) ? u[k] : ''), c] : null)].filter(Boolean);
  // 標籤一個接一個排，置中
  const widths = tags.map(([t]) => g.measureText(t).width + 2), total = widths.reduce((a, b) => a + b, 0);
  let tx = x - total / 2;
  tags.forEach(([t, c], k) => { g.fillStyle = c; g.textAlign = 'left'; g.fillText(t, tx, top + 14); tx += widths[k]; });
  g.textAlign = 'center';
  // 敵人意圖
  if (u.side === 'enemy' && !busy) {
    const [kind, v, times = 1] = intent(u);
    const txt = u.stun ? '暈' : kind === 'atk' ? `⚔${v + u.str}${times > 1 ? '×' + times : ''}` : kind === 'def' ? `🛡${v}` : kind === 'buff' ? '力↑' : kind === 'weak' ? '弱化' : '易傷';
    g.font = 'bold 11px sans-serif'; g.fillStyle = '#000'; g.fillText(txt, x + 1, top - 6); g.fillStyle = kind === 'atk' ? '#ff8080' : '#a0d8ff'; g.fillText(txt, x, top - 7);
  }
  if (u === target && !u.dead) { g.fillStyle = '#ffe070'; g.beginPath(); g.moveTo(x - 5, GROUND + 10); g.lineTo(x + 5, GROUND + 10); g.lineTo(x, GROUND + 4); g.fill(); }
}

function draw(now) {
  g.save();
  if (shake > 0) { g.translate(rnd(-1, 1) * shake, rnd(-1, 1) * shake); shake = Math.max(0, shake - 0.3); }
  drawBackground(now);
  if (B) { for (const f of [...B.foes].reverse()) drawUnit(f, now); drawUnit(B.hero, now); }
  // 綁著紅線的敵人之間一直連著一條會晃的紅線
  if (B) {
    const L = B.foes.filter((f) => f.link && !f.dead);
    g.strokeStyle = 'rgba(255,48,80,0.7)';
    for (let i = 1; i < L.length; i++) { const a = L[i - 1].x + L[i - 1].ox, b = L[i].x + L[i].ox; g.beginPath(); g.moveTo(a, GROUND - 30); g.quadraticCurveTo((a + b) / 2, GROUND - 22 + Math.sin(now / 300 + i) * 4, b, GROUND - 30); g.stroke(); }
  }
  effects = effects.filter((e) => now < e.t0 + e.ms);
  for (const e of effects) {
    const k = (now - e.t0) / e.ms;
    if (e.type === 'text') { g.globalAlpha = 1 - k; g.font = 'bold 14px sans-serif'; g.textAlign = 'center'; g.fillStyle = '#000'; g.fillText(e.text, e.x + 1, e.y - k * 20 + 1); g.fillStyle = e.color; g.fillText(e.text, e.x, e.y - k * 20); g.globalAlpha = 1; }
    if (e.type === 'flash') { g.fillStyle = `rgba(255,240,200,${(1 - k) * 0.6})`; g.fillRect(0, 0, W, H); }
    if (e.type === 'bolt') {
      const xx = e.x1 + (e.x2 - e.x1) * Math.min(1, k * 1.5), yy = GROUND - 44 - Math.sin(Math.min(1, k * 1.5) * Math.PI) * 14;
      if (k < 0.67) { for (let s = 0; s < 5; s++) { g.globalAlpha = 1 - s * 0.18; g.fillStyle = e.color; g.fillRect(Math.round(xx - s * 6 - 3), Math.round(yy - 3 + s % 2), 6 - s, 6 - s); } g.globalAlpha = 1; g.fillStyle = '#fff'; g.fillRect(Math.round(xx - 3), Math.round(yy - 3), 6, 6); }
    }
    if (e.type === 'burst') {
      for (let s = 0; s < 10; s++) { const ang = s * 0.63 + e.seed, d = 6 + k * 26; g.globalAlpha = 1 - k; g.fillStyle = s % 3 ? e.color : '#fff'; g.fillRect(Math.round(e.x + Math.cos(ang) * d - 2), Math.round(GROUND - 40 + Math.sin(ang) * d * 0.8 - 2), 4, 4); }
      g.globalAlpha = 1;
    }
    if (e.type === 'banner' && k >= 0) {
      const a = k < 0.1 ? k * 10 : k > 0.8 ? (1 - k) * 5 : 1;
      g.globalAlpha = a; g.fillStyle = 'rgba(0,0,0,0.6)'; g.fillRect(0, 70, W, 50);
      g.textAlign = 'center'; g.font = 'bold 20px sans-serif'; g.fillStyle = '#ffd070'; g.fillText(e.text, W / 2, 94);
      g.font = '11px sans-serif'; g.fillStyle = '#fff'; g.fillText(e.sub || '', W / 2, 111); g.globalAlpha = 1;
    }
    if (e.type === 'thread') {
      g.globalAlpha = 1 - k; g.strokeStyle = '#ff3050'; g.lineWidth = 2; g.beginPath();
      g.moveTo(e.x1, GROUND - 40); g.quadraticCurveTo((e.x1 + e.x2) / 2, GROUND - 70 - Math.sin(k * 6) * 6, e.x2, GROUND - 40); g.stroke(); g.globalAlpha = 1; g.lineWidth = 1;
    }
    if (e.type === 'clone') {
      const xx = e.x1 + (e.x2 - e.x1) * Math.min(1, k * 1.6);
      g.save(); g.globalAlpha = 0.75 * (1 - Math.max(0, k - 0.7) / 0.3); g.filter = 'brightness(0.45) sepia(1) hue-rotate(230deg) saturate(5)';
      drawArt(g, e.art, 'walk', Math.floor(now / 90) % (ART[e.art].anims ? 3 : 4), xx, GROUND, 1);
      g.restore();
    }
  }
  const v = g.createRadialGradient(W / 2, H * 0.6, 80, W / 2, H * 0.6, 260); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.55)');
  g.fillStyle = v; g.fillRect(0, 0, W, H);
  g.restore();
  requestAnimationFrame(draw);
}

preloadArt();
const check = setInterval(() => {
  const ready = HEROES.every((h) => Object.keys(ART[h].sheets).every((s) => artSheet(h, s))) && Object.keys(UNIT_ART).every((k) => artSheet('u:' + k, 'pose'));
  if (ready) { clearInterval(check); showPick(); requestAnimationFrame(draw); }
}, 50);
</script>
</body>
</html>
