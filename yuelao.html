<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>月老動畫測試</title>
<link rel="stylesheet" href="style.css">
<style>
  .stage { width: 100%; height: auto; border: 2px solid var(--line); background: #1d1a26; }
  .acts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px; }
  .acts .btn.active { border-color: var(--gold); background: #3a3420; }
  .sheet { width: 100%; height: auto; margin-top: 12px; background: #2a2638; }
</style>
</head>
<body>
<div id="app">
  <h2>月老・動畫測試</h2>
  <p class="muted">用一張圖的 5 個姿勢，靠程式補動作。點下面的按鈕切換。</p>
  <canvas class="stage" width="160" height="110"></canvas>
  <div class="acts"></div>
  <p class="muted" style="font-size:13px">原始 spritesheet（每格 49×78）：</p>
  <canvas class="sheet"></canvas>
  <a class="btn wide" href="./" style="display:block;text-align:center;text-decoration:none">回遊戲</a>
</div>
<script>
'use strict';
const FW = 49, FH = 78, HW = 12, HH = 10;
const F = { stand: 0, walk: 1, sit: 2, sleep: 3, punch: 4 };
const stage = document.querySelector('.stage');
const g = stage.getContext('2d');
g.imageSmoothingEnabled = false;
const sheet = new Image(), hearts = new Image();
const GROUND = 100;

// 畫一格：flip 左右翻轉，white 受擊閃白，dy 往下移，breath 上半身下沉 1 格
const tmp = document.createElement('canvas'); tmp.width = FW; tmp.height = FH;
const tg = tmp.getContext('2d');
function frame(i, x, { flip = false, white = false, dy = 0, breath = 0 } = {}) {
  tg.clearRect(0, 0, FW, FH);
  if (breath) {
    // 上半身（腰以上）往下壓 1 像素，看起來像在呼吸
    const waist = i === F.sleep ? FH : 52;
    tg.drawImage(sheet, i * FW, 0, FW, waist, 0, breath, FW, waist);
    tg.drawImage(sheet, i * FW, waist, FW, FH - waist, 0, waist, FW, FH - waist);
  } else tg.drawImage(sheet, i * FW, 0, FW, FH, 0, 0, FW, FH);
  if (white) { tg.globalCompositeOperation = 'source-atop'; tg.fillStyle = '#fff'; tg.fillRect(0, 0, FW, FH); tg.globalCompositeOperation = 'source-over'; }
  g.save();
  const left = Math.round(x - FW / 2), top = GROUND - FH + dy;
  if (flip) { g.translate(left + FW, top); g.scale(-1, 1); g.drawImage(tmp, 0, 0); }
  else g.drawImage(tmp, left, top);
  g.restore();
}
function heart(i, x, y, alpha = 1) {
  g.globalAlpha = alpha;
  g.drawImage(hearts, (i % 5) * HW, 0, HW, HH, Math.round(x), Math.round(y), HW, HH);
  g.globalAlpha = 1;
}

let mode = 'idle', t0 = performance.now();
const ANIMS = {
  idle: { name: '待機', draw(t) { frame(F.stand, 80, { breath: Math.floor(t / 600) % 2 }); } },
  walk: { name: '走路', draw(t) {
    // 站姿和走路姿勢交替，加上一點彈跳，來回走
    const step = Math.floor(t / 180), span = 100, p = (t / 25) % (span * 2);
    const dir = p < span ? 1 : -1, x = 30 + (p < span ? p : span * 2 - p);
    frame(step % 2 ? F.walk : F.stand, x, { flip: dir < 0, dy: step % 2 ? -1 : 0 });
  } },
  punch: { name: '出拳', draw(t) {
    // 蓄力 → 前衝 → 命中停頓 → 回位
    const c = t % 1400;
    if (c < 400) frame(F.stand, 70 - Math.min(3, c / 100), { breath: 1 });
    else if (c < 520) frame(F.punch, 72 + (c - 400) / 15, { flip: true });
    else if (c < 800) { frame(F.punch, 80, { flip: true }); if (c < 640) { g.fillStyle = '#ffe070'; g.fillRect(118, 52, 3, 3); g.fillRect(122, 48, 2, 2); g.fillRect(122, 57, 2, 2); } }
    else frame(F.stand, 80 - Math.min(10, (c - 800) / 30));
  } },
  sit: { name: '打坐', draw(t) {
    frame(F.sit, 80, { breath: Math.floor(t / 900) % 2 });
    // 愛心慢慢往上飄
    for (let k = 0; k < 3; k++) {
      const p = ((t / 2200) + k / 3) % 1;
      heart(k, 104 + Math.sin(p * 6 + k) * 6 + k * 5, 44 - p * 40, 1 - p);
    }
  } },
  sleep: { name: '睡覺', draw(t) {
    frame(F.sleep, 80, { breath: Math.floor(t / 1200) % 2 });
    g.fillStyle = '#a0d8ff'; g.font = 'bold 10px monospace';
    for (let k = 0; k < 3; k++) {
      const p = ((t / 2400) + k / 3) % 1;
      g.globalAlpha = 1 - p; g.fillText('z', 100 + p * 14, 66 - p * 24); g.globalAlpha = 1;
    }
  } },
  hurt: { name: '受傷', draw(t) {
    // 受傷暫時用站姿：閃白、往後退，再倒地
    const c = t % 2200;
    if (c < 500) frame(F.stand, 80 - Math.min(6, c / 40), { white: Math.floor(c / 80) % 2 === 0 });
    else if (c < 1700) frame(F.sleep, 76, { dy: c < 600 ? -2 : 0 });
    else frame(F.stand, 80);
  } },
};

const acts = document.querySelector('.acts');
for (const [id, a] of Object.entries(ANIMS)) {
  const b = document.createElement('button');
  b.className = 'btn'; b.textContent = a.name; b.dataset.id = id;
  b.onclick = () => { mode = id; t0 = performance.now(); for (const x of acts.children) x.classList.toggle('active', x.dataset.id === id); };
  acts.append(b);
}
acts.firstChild.classList.add('active');

function loop(now) {
  g.fillStyle = '#1d1a26'; g.fillRect(0, 0, stage.width, stage.height);
  g.fillStyle = '#2b2735'; g.fillRect(0, GROUND, stage.width, stage.height - GROUND);
  ANIMS[mode].draw(now - t0);
  requestAnimationFrame(loop);
}

let loaded = 0;
const ready = () => {
  if (++loaded < 2) return;
  const s = document.querySelector('.sheet');
  s.width = sheet.width; s.height = sheet.height;
  const sg = s.getContext('2d'); sg.imageSmoothingEnabled = false; sg.drawImage(sheet, 0, 0);
  requestAnimationFrame(loop);
};
sheet.onload = ready; hearts.onload = ready;
sheet.src = 'assets/yuelao/sheet.png';
hearts.src = 'assets/yuelao/small.png';
</script>
</body>
</html>
