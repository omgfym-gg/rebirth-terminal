<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#0b0a12">
  <title>轉生終端</title>
  <link rel="stylesheet" href="style.css?v=20261026c">
</head>
<body>
  <main id="app">
    <section id="title" class="screen active">
      <canvas class="banner"></canvas>
      <h1>轉生終端</h1>
      <p class="subtitle">死亡不是結束，而是另一種開始。</p>
      <div class="menu"></div>
      <p class="muted small">第一版測試・存檔只存在這支手機的瀏覽器裡</p>
    </section>

    <section id="story" class="screen">
      <div class="story-head">
        <canvas class="portrait"></canvas>
        <div class="speaker"></div>
      </div>
      <div class="story-text"></div>
      <div class="story-buttons"></div>
    </section>

    <section id="rebirth" class="screen">
      <div class="content"></div>
    </section>

    <section id="terminal" class="screen">
      <canvas class="banner"></canvas>
      <div class="content"></div>
    </section>

    <!-- 一筆紅線戰鬥（js/redline.js） -->
    <section id="battle" class="screen rl">
      <div class="top"><span class="floor"></span><span class="turn muted"></span><button class="btn sound" aria-label="聲音開關">🔊</button><button class="btn helpbtn">玩法</button><button class="btn leave">離開</button></div>
      <div class="stage-wrap"><canvas class="stage" width="600" height="540"></canvas></div>
      <div class="ink"><div></div></div>
      <div class="who"></div>
      <div class="skills"></div>
      <div class="tip"></div>
      <div class="acts"><button class="btn how">怎麼畫</button><button class="btn move">移動</button><button class="btn redo">重畫</button><button class="btn primary go">出招</button></div>
    </section>
  </main>
  <div class="overlay"><div class="box"></div></div>
  <button class="btn sound corner" aria-label="聲音開關">🔊</button>

  <script src="js/audio.js?v=20261026c"></script>
  <script src="js/data.js?v=20261026c"></script>
  <script src="js/jobs.js?v=20261026c"></script>
  <script src="js/sprites.js?v=20261026c"></script>
  <script src="js/redline.js?v=20261026d"></script>
  <script src="js/tutorial.js?v=20261026c"></script>
  <script src="js/main.js?v=20261026c"></script>
</body>
</html>
